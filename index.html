<!DOCTYPE html>
<html lang="es-MX">
<head>
<meta charset="utf-8">

<title>Plan de Ascenso · Cap. 1/o. Enfermera</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='18' fill='%237a52f4'/%3E%3Cpath d='M32 13l5.6 11.4 12.6 1.8-9.1 8.9 2.1 12.5L32 41.7l-11.2 5.9 2.1-12.5-9.1-8.9 12.6-1.8z' fill='%23fff'/%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="icon-192.png">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --pri:#5b4bf5; --pri2:#8b5cf6; --pri-osc:#3a2fb8; --coral:#ff7a5c; --peach:#ffb48f; --mint:#22c39a; --sol:#ffc83d;
  --fondo:#f6f4ff; --blanco:#ffffff; --sup2:#f0edff; --texto:#1c1a3a; --gris:#67658a; --borde:#e4e0fa;
  --verde:var(--pri); --verde-osc:var(--pri-osc); --verde-2:var(--pri2); --verde-cl:#ece9ff; --caqui:var(--coral); --caqui-cl:#fff0ea;
  --ok:#139a6f; --ok-cl:#e3f8ef; --warn:#c9780a; --mal:#e0405a; --mal-cl:#ffe9ec;
  --grad:linear-gradient(135deg,#5b4bf5 0%,#8b5cf6 55%,#c35cf0 100%);
  --grad-c:linear-gradient(135deg,#ff8a5c 0%,#ff5c8a 100%);
  --grad-m:linear-gradient(135deg,#22c39a 0%,#3fb6f0 100%);
  --r:20px; --r2:14px; --sombra:0 1px 2px rgba(40,30,110,.05),0 8px 24px rgba(60,40,160,.08); --sombra2:0 14px 40px rgba(70,50,180,.18);
  --glass:rgba(255,255,255,.72);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:11pt;-webkit-text-size-adjust:100%}
body{margin:0;font-family:'Noto Sans',system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;background:var(--fondo);color:var(--texto);line-height:1.5;padding-bottom:calc(84px + env(safe-area-inset-bottom));min-height:100vh;
  background-image:radial-gradient(700px 380px at 110% -10%,rgba(139,92,246,.16),transparent 60%),radial-gradient(520px 320px at -20% 8%,rgba(255,138,92,.13),transparent 60%);background-attachment:fixed}
a{color:var(--pri)}
h1,h2,h3{margin:.15em 0 .45em;line-height:1.2;letter-spacing:-.01em}
h1{font-size:1.55rem;font-weight:800} h2{font-size:1.2rem;font-weight:800} h3{font-size:1.04rem;font-weight:700}
header.top{position:sticky;top:0;z-index:20;background:var(--glass);-webkit-backdrop-filter:saturate(1.6) blur(16px);backdrop-filter:saturate(1.6) blur(16px);color:var(--texto);padding:10px 14px;padding-top:calc(10px + env(safe-area-inset-top));display:flex;align-items:center;gap:8px;border-bottom:1px solid rgba(120,100,220,.10)}
header.top .logo{width:34px;height:34px;flex:none;border-radius:11px;box-shadow:0 4px 12px rgba(91,75,245,.35)}
header.top .tt{font-weight:800;font-size:1rem;line-height:1.1}
header.top .st{font-size:.74rem;color:var(--gris)}
header.top .sp{flex:1}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:.8rem;font-weight:800;border-radius:999px;padding:4px 10px;background:var(--blanco);box-shadow:var(--sombra);color:var(--texto);text-decoration:none;white-space:nowrap}
.chip.fl{color:#e8552f}.chip.fl.off{color:var(--gris)}
#hdrRank{font-size:.78rem}
.hbtn{background:var(--blanco);border:0;color:var(--texto);cursor:pointer;width:34px;height:34px;border-radius:12px;display:inline-flex;align-items:center;justify-content:center;box-shadow:var(--sombra);font-size:1rem;text-decoration:none}
#pomoBar{display:none;background:var(--grad-c);color:#fff;padding:7px 14px;font-weight:700;font-size:.9rem;cursor:pointer;position:sticky;top:58px;z-index:19}
main{max-width:720px;margin:0 auto;padding:14px 14px 10px}
.card{background:var(--blanco);border:1px solid var(--borde);border-radius:var(--r);padding:16px 16px;margin:0 0 14px;box-shadow:var(--sombra)}
.card.hl{border:1px solid var(--borde);position:relative;overflow:hidden}
.card.hl::before{content:'';position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--grad)}
.card.warn{background:linear-gradient(135deg,#fff6e8,#fff1ea);border-color:#ffd9b0}
.card.info{background:linear-gradient(135deg,#f1eeff,#fdf0ff);border-color:#e2d9ff}
.grid{display:grid;gap:10px}
.g2{grid-template-columns:1fr 1fr} .g3{grid-template-columns:repeat(3,1fr)} .g4{grid-template-columns:repeat(4,1fr)}
@media (max-width:520px){.g4{grid-template-columns:1fr 1fr}.g3.r{grid-template-columns:1fr}}
.stat{background:var(--blanco);border:1px solid var(--borde);border-radius:16px;padding:10px;text-align:center;box-shadow:var(--sombra)}
.stat b{display:block;font-size:1.5rem;font-weight:900;color:var(--pri)}
.stat span{font-size:.76rem;color:var(--gris)}
.btn{appearance:none;border:0;background:var(--grad);color:#fff;border-radius:14px;padding:10px 16px;font:inherit;font-weight:800;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;min-height:44px;box-shadow:0 6px 16px rgba(91,75,245,.28);letter-spacing:.01em}
.btn.sec{background:var(--blanco);color:var(--pri-osc);box-shadow:inset 0 0 0 1.5px var(--borde)}
.btn.sm{padding:6px 12px;min-height:34px;font-size:.86rem;border-radius:11px}
.btn.peligro{background:linear-gradient(135deg,#ff6b7d,#e0405a);box-shadow:0 6px 16px rgba(224,64,90,.25)}
.btn.coral{background:var(--grad-c);box-shadow:0 6px 16px rgba(255,92,138,.3)}
.btn.mint{background:var(--grad-m);box-shadow:0 6px 16px rgba(34,195,154,.3)}
.btn.xl{width:100%;min-height:60px;font-size:1.15rem;border-radius:20px}
.btn:disabled{opacity:.45;cursor:default;box-shadow:none}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.muted{color:var(--gris);font-size:.88rem}
.small{font-size:.86rem}
label{font-weight:700;font-size:.88rem;display:block;margin:8px 0 4px}
input,select,textarea{font:inherit;width:100%;padding:10px 12px;border:1.5px solid var(--borde);border-radius:12px;background:var(--blanco);color:var(--texto);transition:border-color .2s,box-shadow .2s}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--pri2);box-shadow:0 0 0 4px rgba(139,92,246,.15)}
textarea{min-height:80px;resize:vertical}
input[type=checkbox]{width:auto;transform:scale(1.3);accent-color:var(--pri)}
.bar{height:10px;background:var(--verde-cl);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--grad);border-radius:99px}
.tag{display:inline-block;font-size:.74rem;padding:2px 9px;border-radius:99px;background:var(--verde-cl);color:var(--pri-osc);font-weight:700}
.tag.k{background:var(--caqui-cl);color:#b5452a}
.task{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--borde)}
.task:last-child{border-bottom:0}
.task .tx{flex:1}
.task.done .tx{opacity:.5;text-decoration:line-through}
.task .min{font-size:.8rem;color:var(--gris);white-space:nowrap}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;margin-right:4px;vertical-align:middle}
nav.tabs{position:fixed;bottom:10px;left:10px;right:10px;max-width:560px;margin:0 auto;background:var(--glass);-webkit-backdrop-filter:saturate(1.6) blur(18px);backdrop-filter:saturate(1.6) blur(18px);border:1px solid rgba(120,100,220,.14);border-radius:24px;display:flex;z-index:30;padding:6px;margin-bottom:env(safe-area-inset-bottom);box-shadow:0 10px 30px rgba(50,30,140,.16)}
nav.tabs a{flex:1;text-align:center;padding:6px 2px 5px;text-decoration:none;color:var(--gris);font-size:.7rem;font-weight:700;border-radius:18px;transition:background .25s,color .25s}
nav.tabs a svg{display:block;margin:0 auto 2px;width:23px;height:23px;stroke:currentColor}
nav.tabs a.on{color:var(--pri);background:var(--verde-cl)}
nav.tabs a.on svg{stroke:var(--pri)}
.seg{display:flex;gap:4px;background:var(--sup2);border-radius:14px;padding:4px;flex-wrap:wrap}
.seg button{flex:1;border:0;background:transparent;color:var(--gris);padding:8px 6px;font:inherit;font-size:.86rem;font-weight:700;cursor:pointer;min-width:70px;border-radius:11px;transition:all .2s}
.seg button.on{background:var(--blanco);color:var(--pri);box-shadow:0 2px 8px rgba(60,40,160,.12)}
.st0{color:#8b89a6}.st1{color:#c9780a}.st2{color:#3b82f6}.st3{color:var(--ok)}
.unit{display:flex;gap:10px;align-items:center;padding:10px 4px;border-bottom:1px solid var(--borde);cursor:pointer;border-radius:10px}
.unit:hover{background:var(--sup2)}
.unit .nm{flex:1;font-size:.92rem}
.pill{font-size:.72rem;border-radius:99px;padding:2px 9px;border:1.5px solid currentColor;white-space:nowrap;font-weight:700}
details>summary{cursor:pointer;font-weight:700;padding:6px 0}
.week{display:grid;gap:10px}
.day{background:var(--blanco);border:1px solid var(--borde);border-radius:16px;padding:10px 12px}
.day.today{border:2px solid var(--pri2);box-shadow:0 0 0 4px rgba(139,92,246,.12)}
.day h4{margin:0 0 4px;font-size:.92rem;display:flex;justify-content:space-between}
.chart .r{display:grid;grid-template-columns:110px 1fr 52px;gap:6px;align-items:center;margin:6px 0;font-size:.84rem}
.flash{min-height:150px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:1.1rem;padding:18px;background:var(--blanco);border:2px solid var(--verde-cl);border-radius:18px;white-space:pre-wrap}
.timer{font-size:3.6rem;font-weight:900;text-align:center;color:var(--pri);font-variant-numeric:tabular-nums;letter-spacing:1px}
.cornell{display:grid;grid-template-columns:34% 1fr;gap:8px}
.cornell .sum{grid-column:1/3}
.aviso{background:#fff7e6;border:1px solid #ffdca0;border-radius:14px;padding:10px 12px;font-size:.86rem}
table.hab{border-collapse:collapse;width:100%;font-size:.85rem}
table.hab th,table.hab td{border:1px solid var(--borde);padding:6px;text-align:center}
table.hab td:first-child,table.hab th:first-child{text-align:left}
.list li{margin:5px 0}
.hide{display:none!important}
.q{margin:10px 0 6px;font-weight:700;font-size:.95rem}
.toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:#1c1a3a;color:#fff;padding:11px 16px;border-radius:14px;z-index:80;font-size:.9rem;font-weight:600;max-width:90%;box-shadow:var(--sombra2);animation:toastIn .35s cubic-bezier(.2,1.4,.4,1) both}
.mas a.card{display:block;text-decoration:none;color:inherit}
@media print{nav.tabs,header.top,#pomoBar{display:none}}
/* animaciones */
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,16px) scale(.95)}to{opacity:1;transform:translate(-50%,0)}}
@keyframes grow{from{width:0}}
@keyframes ring{from{stroke-dasharray:0 100}}
@keyframes pop{0%{transform:scale(.6);opacity:0}60%{transform:scale(1.06);opacity:1}100%{transform:scale(1)}}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes shake{0%,100%{transform:none}20%{transform:translateX(-7px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(139,92,246,.5)}70%{box-shadow:0 0 0 18px rgba(139,92,246,0)}100%{box-shadow:0 0 0 0 rgba(139,92,246,0)}}
@keyframes flame{0%,100%{transform:scale(1) rotate(-2deg)}50%{transform:scale(1.08) rotate(2deg)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes shine{from{background-position:-200% 0}to{background-position:200% 0}}
@keyframes slideIn{from{opacity:0;transform:translateX(30px)}to{opacity:1;transform:none}}
@keyframes sheet{from{transform:translateY(100%)}to{transform:none}}
main>*{animation:fadeUp .35s cubic-bezier(.2,.8,.2,1) both}
main>*:nth-child(2){animation-delay:.05s}main>*:nth-child(3){animation-delay:.1s}main>*:nth-child(4){animation-delay:.15s}main>*:nth-child(5){animation-delay:.2s}
.bar>i{animation:grow .9s cubic-bezier(.2,.8,.2,1) both;transition:width .5s cubic-bezier(.2,.8,.2,1)}
svg .rg{animation:ring 1.1s cubic-bezier(.2,.8,.2,1) both}
.btn{transition:transform .12s cubic-bezier(.3,1.6,.5,1),filter .2s,box-shadow .2s}.btn:active{transform:scale(.95)}.btn:hover{filter:brightness(1.05)}
.seg.scroll{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}.seg.scroll::-webkit-scrollbar{display:none}.seg.scroll button{flex:0 0 auto;padding:8px 13px}
.flip{perspective:1200px;cursor:pointer;margin-top:10px}
.flip .in{display:grid;transition:transform .6s cubic-bezier(.3,1.3,.4,1);transform-style:preserve-3d}
.flip.on .in{transform:rotateY(180deg)}
.flip .fc{grid-area:1/1;backface-visibility:hidden;-webkit-backface-visibility:hidden;min-height:200px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:22px;border-radius:22px;white-space:pre-wrap;font-size:1.08rem;font-weight:600;background:var(--blanco);box-shadow:var(--sombra2);border:1px solid var(--borde)}
.flip .fc::before{content:'Pregunta';position:absolute;top:12px;left:16px;font-size:.68rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--pri2)}
.flip .fc{position:relative}
.flip .fc.back{transform:rotateY(180deg);background:linear-gradient(160deg,#fff6f1,#fff);text-align:left;align-items:flex-start;font-weight:400}
.flip .fc.back::before{content:'Respuesta';color:var(--coral)}
.flip .fc .ref{font-size:.78rem;color:var(--gris);margin-top:12px;font-weight:700}
.fuente{font-size:.82rem;background:var(--sup2);border-radius:14px;padding:10px 12px;margin-top:10px}
.fuente .dif{color:var(--warn);font-weight:700}
.art{padding:12px 0;border-bottom:1px solid var(--borde)}
.art:last-child{border-bottom:0}
.art h4{margin:0 0 6px;font-size:.98rem;color:var(--pri-osc);display:flex;justify-content:space-between;align-items:center;gap:6px;font-weight:800}
.art p{margin:6px 0;font-size:.97rem;line-height:1.62}
.art p.fr{padding-left:14px;border-left:3px solid var(--verde-cl)}
.art p.nota{font-size:.74rem;color:var(--gris);margin:1px 0 4px}
.art .sec{font-size:.72rem;color:var(--gris);font-weight:500}
mark{background:linear-gradient(transparent 35%,#ffe08a 35%);color:inherit;padding:0 1px}
mark.sv{background:linear-gradient(transparent 30%,rgba(255,138,92,.45) 30%)}
.enc{font-size:.84rem;margin:2px 0;color:var(--pri-osc)}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;margin:9px 0;background:var(--blanco);color:var(--texto);border:2px solid var(--borde);border-bottom-width:4px;border-radius:18px;padding:14px 14px;font:inherit;font-size:.98rem;font-weight:600;cursor:pointer;transition:transform .12s,border-color .2s,background .2s;min-height:58px}
.opt .lt{flex:none;width:30px;height:30px;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;font-size:.85rem;font-weight:900;background:var(--sup2);color:var(--pri)}
.opt:hover{border-color:var(--pri2)}
.opt:active{transform:translateY(2px);border-bottom-width:2px}
.opt.ok{background:var(--ok-cl);border-color:var(--ok);animation:pop .4s}
.opt.ok .lt{background:var(--ok);color:#fff}
.opt.bad{background:var(--mal-cl);border-color:var(--mal);animation:shake .4s}
.opt.bad .lt{background:var(--mal);color:#fff}
.opt:disabled{cursor:default}
.opt:disabled:not(.ok):not(.bad){opacity:.6}
.fb{border-radius:18px;padding:14px 16px;margin-top:12px;font-size:.92rem;animation:fadeUp .35s both;line-height:1.55}
.fb.ok{background:var(--ok-cl);border:1.5px solid #a9e8cf}.fb.bad{background:var(--mal-cl);border:1.5px solid #ffc2cb}
.fb .fbh{font-size:1.1rem;font-weight:900;display:flex;align-items:center;gap:8px;margin-bottom:4px}
.fb.ok .fbh{color:var(--ok)}.fb.bad .fbh{color:var(--mal)}
.xpbox{display:flex;gap:14px;align-items:center}
.rank{font-weight:800;color:var(--pri-osc);font-size:1.08rem;display:flex;align-items:center;gap:6px}
.chev{display:none}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:10px}
.badge{text-align:center;padding:12px 6px;border-radius:18px;border:1px solid var(--borde);background:var(--blanco);font-size:.76rem;line-height:1.3}
.badge .ic{display:flex;align-items:center;justify-content:center;margin:0 auto 6px;width:58px;height:58px;border-radius:50%;font-size:1.7rem;box-shadow:inset 0 -4px 0 rgba(0,0,0,.15),0 6px 14px rgba(60,40,160,.18)}
.badge.off{opacity:.55}.badge.off .ic{filter:grayscale(1);opacity:.45}
.badge.on{box-shadow:var(--sombra)}
.overlay{position:fixed;inset:0;background:rgba(20,14,50,.55);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);z-index:60;display:flex;align-items:center;justify-content:center;padding:20px;animation:fadeUp .2s both}
.overlay .box{background:var(--blanco);border-radius:28px;padding:26px;text-align:center;max-width:340px;animation:pop .5s cubic-bezier(.2,1.4,.4,1) both;color:var(--texto);box-shadow:var(--sombra2)}
.overlay .big{font-size:3.2rem;animation:bounce 1.2s ease-in-out infinite}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:70}
.qhead{display:flex;justify-content:space-between;align-items:center;gap:8px}
.timerq{font-variant-numeric:tabular-nums;font-weight:800;color:var(--pri)}
.timerq.low{color:var(--mal)}
.mini{display:inline-flex;vertical-align:middle}
.cont-tag{font-size:.68rem;padding:2px 7px;border-radius:99px;background:var(--verde-cl);color:var(--pri-osc);font-weight:700;margin-left:4px}
.cont-tag.priv{background:#fff0ea;color:#b5452a}
/* ===== v4 componentes ===== */
.hero{position:relative;overflow:hidden;border-radius:28px;padding:20px 18px 18px;color:#fff;background:var(--grad);box-shadow:0 18px 40px rgba(91,75,245,.35);margin-bottom:16px}
.hero::after{content:'';position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.28),transparent 65%)}
.hero h1{color:#fff;font-size:1.7rem;margin:4px 0 6px;font-weight:900;position:relative;z-index:1}
.hero p{margin:0 0 4px;opacity:.95;position:relative;z-index:1}
.hero .kick{font-size:.78rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;opacity:.85;position:relative;z-index:1}
.hero .ill{position:absolute;right:-6px;bottom:72px;width:150px;opacity:.95;pointer-events:none;animation:float 6s ease-in-out infinite}
.hero .mix{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0 14px;position:relative;z-index:1}
.hero .mix span{background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.28);border-radius:99px;padding:4px 10px;font-size:.8rem;font-weight:700}
.btn.go{background:#fff;color:var(--pri-osc);box-shadow:0 10px 24px rgba(20,10,80,.25);position:relative;z-index:1;font-size:1.12rem;min-height:60px;width:100%;border-radius:20px;font-weight:900}
.btn.go::after{content:'';position:absolute;inset:0;border-radius:inherit;background:linear-gradient(110deg,transparent 30%,rgba(139,92,246,.18) 50%,transparent 70%);background-size:200% 100%;animation:shine 2.8s linear infinite}
.btn.go.done{background:rgba(255,255,255,.2);color:#fff;box-shadow:none;border:1.5px solid rgba(255,255,255,.5)}
.btn.go.done::after{display:none}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
.tile{background:var(--blanco);border:1px solid var(--borde);border-radius:22px;padding:14px;box-shadow:var(--sombra);text-decoration:none;color:inherit;display:block;position:relative;overflow:hidden}
.tile .big{font-size:1.7rem;font-weight:900;line-height:1.1}
.tile .lbl{font-size:.78rem;color:var(--gris);font-weight:600}
.flame{display:inline-block;animation:flame 1.6s ease-in-out infinite;transform-origin:50% 90%}
.sect{display:flex;justify-content:space-between;align-items:baseline;margin:18px 4px 10px}
.sect h2{margin:0;font-size:1.15rem}
.sect a{font-size:.85rem;font-weight:700;text-decoration:none}
.mscroll{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:4px 2px 12px;margin:0 -14px;padding-left:14px;padding-right:14px;scrollbar-width:none}
.mscroll::-webkit-scrollbar{display:none}
.mcard{flex:0 0 46%;scroll-snap-align:start;border-radius:24px;padding:14px;color:#fff;text-decoration:none;position:relative;overflow:hidden;min-height:150px;display:flex;flex-direction:column;justify-content:space-between;box-shadow:0 10px 24px rgba(40,20,120,.18)}
.mcard .ico{width:44px;height:44px;border-radius:14px;background:rgba(255,255,255,.22);display:flex;align-items:center;justify-content:center}
.mcard .ico svg{width:26px;height:26px}
.mcard b{font-size:.98rem;line-height:1.2;font-weight:800}
.mcard .pp{font-size:.76rem;opacity:.92;font-weight:600}
.mcard .bar{background:rgba(255,255,255,.28);height:7px;margin-top:6px}.mcard .bar>i{background:#fff}
.mico{display:inline-flex;width:40px;height:40px;border-radius:13px;align-items:center;justify-content:center;color:#fff;flex:none}
.mico svg{width:24px;height:24px}
.reto{display:flex;gap:12px;align-items:center}
.reto .rico{width:52px;height:52px;border-radius:16px;background:var(--grad-c);display:flex;align-items:center;justify-content:center;font-size:1.6rem;flex:none;box-shadow:0 8px 18px rgba(255,92,138,.3)}
.liga{display:flex;gap:14px;align-items:center}
/* sesión guiada */
.ses-top{position:sticky;top:0;z-index:25;display:flex;align-items:center;gap:10px;padding:10px 0 8px;background:linear-gradient(var(--fondo) 70%,transparent)}
.ses-x{width:38px;height:38px;border-radius:12px;border:0;background:var(--blanco);box-shadow:var(--sombra);font-size:1.1rem;cursor:pointer;color:var(--gris);flex:none}
.ses-bar{flex:1;height:14px;background:var(--verde-cl);border-radius:99px;overflow:hidden;position:relative}
.ses-bar i{position:absolute;left:0;top:0;bottom:0;background:var(--grad-m);border-radius:99px;transition:width .6s cubic-bezier(.2,1.2,.4,1)}
.ses-bar i::after{content:'';position:absolute;left:8px;right:8px;top:3px;height:3px;border-radius:9px;background:rgba(255,255,255,.45)}
.combo{font-weight:900;font-size:.9rem;color:#e8552f;min-width:46px;text-align:right;white-space:nowrap}
.combo.up{animation:pop .45s}
.kind{display:inline-flex;align-items:center;gap:6px;font-size:.74rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:4px 10px;border-radius:99px;margin-bottom:8px}
.kind.k-leer{background:#e8f4ff;color:#1f6fd1}.kind.k-quiz{background:var(--verde-cl);color:var(--pri)}.kind.k-card{background:#fff0ea;color:#c2410c}
.ses-q{font-size:1.18rem;font-weight:800;line-height:1.35;margin:4px 0 10px}
.ses-foot{position:sticky;bottom:calc(92px + env(safe-area-inset-bottom));z-index:24;margin-top:12px}
.sheet{border-radius:24px;padding:16px;animation:sheet .35s cubic-bezier(.2,1.1,.4,1) both;box-shadow:var(--sombra2)}
.sheet.ok{background:#dcf7ec;color:#0c5c43}.sheet.bad{background:#ffe3e8;color:#8a1730}
.sheet .fbh{font-size:1.2rem;font-weight:900;margin-bottom:4px;display:flex;gap:8px;align-items:center}
.sheet .cita{font-size:.85rem;opacity:.95;max-height:30vh;overflow:auto}
.sheet .cita a{color:inherit;font-weight:700}
.sheet .btn{width:100%;margin-top:10px}
.sheet.ok .btn{background:linear-gradient(135deg,#16b383,#139a6f);box-shadow:0 6px 16px rgba(19,154,111,.3)}
.sheet.bad .btn{background:linear-gradient(135deg,#ff6b7d,#e0405a)}
.bite{background:var(--blanco);border-radius:24px;padding:18px;box-shadow:var(--sombra2);border:1px solid var(--borde)}
.bite .num{font-size:.8rem;font-weight:800;color:#1f6fd1;letter-spacing:.04em}
.bite .ttl{font-size:1.15rem;font-weight:800;margin:2px 0 8px}
.bite p{font-size:1.02rem;line-height:1.7;margin:8px 0}
.bite p.fr{padding-left:12px;border-left:3px solid #cfe3ff}
.end{text-align:center;padding:10px 0}
.end .trophy{width:150px;height:150px;margin:6px auto 0;animation:pop .7s cubic-bezier(.2,1.4,.4,1) both}
.end h1{font-size:2rem;margin:6px 0}
.end .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:16px 0}
.end .stats div{background:var(--blanco);border-radius:20px;padding:12px 6px;box-shadow:var(--sombra);border:2px solid var(--borde);animation:pop .5s both}
.end .stats div:nth-child(2){animation-delay:.15s}.end .stats div:nth-child(3){animation-delay:.3s}
.end .stats b{display:block;font-size:1.5rem;font-weight:900}
.end .stats span{font-size:.72rem;color:var(--gris);font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.end .s-xp{border-color:#ffd66b!important}.end .s-xp b{color:#d39600}
.end .s-ok{border-color:#9fe3c8!important}.end .s-ok b{color:var(--ok)}
.end .s-fl{border-color:#ffb79a!important}.end .s-fl b{color:#e8552f}
.week7{display:flex;justify-content:space-between;gap:4px;margin-top:6px}
.week7 div{flex:1;text-align:center;font-size:.7rem;font-weight:700;color:var(--gris)}
.week7 i{display:flex;margin:4px auto 0;width:30px;height:30px;border-radius:50%;background:var(--sup2);align-items:center;justify-content:center;font-style:normal;font-size:.9rem}
.week7 i.on{background:var(--grad-c);color:#fff;box-shadow:0 4px 10px rgba(255,92,138,.3)}
.week7 i.hoy{outline:2px dashed var(--coral);outline-offset:2px}
/* camino */
.path{position:relative;padding:8px 0 30px}
.path .lib{margin:0;text-align:center}
.path .lib span{display:inline-block;background:var(--blanco);border:1px solid var(--borde);box-shadow:var(--sombra);border-radius:16px;padding:8px 14px;font-weight:800;font-size:.86rem;max-width:90%}
.path .grp{text-align:center;font-size:.76rem;color:var(--gris);font-weight:700;margin:0 10px}
.nodo{display:flex;flex-direction:column;align-items:center;width:150px;text-decoration:none;color:inherit;position:relative;margin:6px 0}
.nodo .bt{width:74px;height:70px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;position:relative;border:0;cursor:pointer;transition:transform .15s;box-shadow:0 7px 0 rgba(0,0,0,.18)}
.nodo .bt:active{transform:translateY(5px);box-shadow:0 2px 0 rgba(0,0,0,.18)}
.nodo .bt svg{width:34px;height:34px}
.nodo.lock .bt{background:#dcd8ee!important;color:#9a96b8;box-shadow:0 7px 0 #c3bedb}
.nodo.cur .bt{animation:pulse 2s infinite}
.nodo .nl{font-size:.78rem;font-weight:700;text-align:center;margin-top:10px;line-height:1.25;max-width:150px}
.nodo .nl small{display:block;font-weight:600;color:var(--gris);font-size:.7rem}
.nodo .ring2{position:absolute;inset:-7px;pointer-events:none}
.nodo .start{position:absolute;top:-34px;left:50%;transform:translateX(-50%);background:var(--blanco);color:var(--pri);font-weight:900;font-size:.78rem;padding:5px 10px;border-radius:10px;box-shadow:var(--sombra2);white-space:nowrap;animation:bounce 1.6s ease-in-out infinite}
.nodo .start::after{content:'';position:absolute;bottom:-6px;left:50%;margin-left:-6px;border:6px solid transparent;border-top-color:var(--blanco);border-bottom:0}
.nodo .crown{position:absolute;right:-4px;top:-6px;width:28px;height:28px;border-radius:50%;background:#ffc83d;display:flex;align-items:center;justify-content:center;font-size:.8rem;box-shadow:0 3px 8px rgba(0,0,0,.2);color:#7a4b00;font-weight:900}
.pathhero{border-radius:28px;padding:18px;color:#fff;display:flex;gap:14px;align-items:center;box-shadow:0 16px 36px rgba(40,20,120,.25);margin-bottom:6px}
.pathhero .mico{width:58px;height:58px;border-radius:18px;background:rgba(255,255,255,.22)}
.pathhero .mico svg{width:34px;height:34px}
.pathhero h1{color:#fff;margin:0;font-size:1.3rem}
/* lectura en tarjetas */
.rdeck{position:relative;display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -16px;padding:4px 16px 14px;scrollbar-width:none;scroll-behavior:smooth}
.rdeck::-webkit-scrollbar{display:none}
.rcard{flex:0 0 88%;scroll-snap-align:center;background:var(--blanco);border:1px solid var(--borde);border-radius:24px;padding:18px;box-shadow:var(--sombra2);max-height:62vh;overflow-y:auto;border-bottom:1px solid var(--borde)!important;position:relative}
.rcard h4{position:sticky;top:-18px;background:var(--blanco);padding:12px 0 6px;margin:-12px 0 4px;z-index:1}
.rcard p{font-size:1.02rem;line-height:1.7}
.rnav{display:flex;align-items:center;gap:10px;justify-content:space-between}
.rnav .cnt{font-weight:800;color:var(--pri);font-size:.9rem}
.dots{display:flex;gap:4px;justify-content:center;flex-wrap:wrap;max-width:60%}
.dots i{width:6px;height:6px;border-radius:9px;background:var(--borde);transition:all .3s}
.dots i.on{width:18px;background:var(--pri)}
.savebtn{position:fixed;z-index:90;background:#1c1a3a;color:#fff;border:0;border-radius:12px;padding:9px 13px;font:inherit;font-weight:800;font-size:.86rem;box-shadow:var(--sombra2);animation:pop .3s both;cursor:pointer}
.subr{border-left:4px solid var(--coral);background:var(--caqui-cl);border-radius:12px;padding:10px 12px;margin:8px 0;font-size:.92rem}
/* insignias de grado */
.ins{display:inline-flex;flex:none}
.rangos{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px}
.rg2{text-align:center;padding:10px 4px;border-radius:18px;background:var(--blanco);border:1px solid var(--borde);font-size:.74rem;font-weight:700;line-height:1.25}
.rg2.off{opacity:.45}.rg2.off svg{filter:grayscale(.9)}
.rg2.me{border:2px solid var(--pri2);box-shadow:0 0 0 4px rgba(139,92,246,.14)}
.rg2 small{display:block;color:var(--gris);font-weight:600}
.sw{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0}
.tog{width:50px;height:30px;border-radius:99px;background:var(--borde);position:relative;border:0;cursor:pointer;transition:background .25s;flex:none}
.tog::after{content:'';position:absolute;left:3px;top:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.2);transition:transform .25s cubic-bezier(.3,1.5,.5,1)}
.tog.on{background:var(--pri)}.tog.on::after{transform:translateX(20px)}
@media (min-width:640px){.mcard{flex-basis:30%}.rcard{flex-basis:70%}}

body.en-sesion header.top,body.en-sesion nav.tabs,body.en-sesion #pomoBar{display:none}
body.en-sesion{padding-bottom:20px}
body.en-sesion .ses-foot{bottom:calc(12px + env(safe-area-inset-bottom))}
body.en-sesion .toast{bottom:auto;top:70px;animation:none}
.sheet .cita{max-height:26vh}
header.top .tt{white-space:nowrap}
@media (max-width:430px){header.top .st{display:none}header.top .tt{font-size:.95rem}}
.week7 i{width:24px;height:24px;font-size:.75rem}
.nodo .ring2{position:absolute;left:-7px;top:-7px;width:88px;height:84px;inset:auto}
.rdeck{align-items:flex-start;transition:height .3s ease}.rcard{min-height:280px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

@media (max-width:400px){header.top .tt{display:none}}
.hero .ill{top:16px;bottom:auto;right:2px;width:118px;opacity:.9}
.hero .kick{max-width:66%}
.week7 i{width:18px;height:18px;font-size:.6rem}
.nodo .bt svg.ring2{width:88px;height:84px}

html.dark .fb.ok{border-color:#1f6b52}html.dark .fb.bad{border-color:#7a2a3e}

 const s=limpia(u.titulo);return s||limpia(u.grupo);}

/* Preguntas guía: generadas SOLO a partir de los títulos del temario. Sin respuestas. */
function preguntas(u){
 const L=u.libro, src=L.corto, t=u.tema;
 const where=u.completo?u.grupo.replace(/\.$/,''):`${u.grupo.replace(/\.$/,'')} – ${u.titulo.replace(/\.$/,'')}`;
 const q=[];
 if(/^Ley completa/.test(u.grupo))q.push(`¿Qué regula ${src} y cómo está estructurada (títulos y capítulos)? Explícalo con tus propias palabras.`);
 else q.push(`¿Qué establece ${src} en «${where}»? Explícalo con tus propias palabras.`);
 q.push(`¿Cuáles son los conceptos, definiciones o clasificaciones clave que presenta el texto sobre «${t}»?`);
 q.push(L.ley?`¿Qué artículos comprende esta parte y cuál es la idea central de cada uno?`:`¿Qué secciones o apartados comprende esta parte y cuál es la idea central de cada uno?`);
 q.push(`¿Qué elementos, requisitos, sujetos, etapas o procedimientos menciona el texto respecto de «${t}»?`);
 q.push(L.ley?`¿Qué obligaciones, prohibiciones o consecuencias señala el texto en esta parte?`:`¿Cómo aplicarías lo que establece el texto sobre «${t}» en tus funciones como Capitán Primero Enfermera?`);
 q.push(`¿Con qué otras unidades del temario se relaciona «${t}»? ¿En qué se parecen y en qué se diferencian?`);
 q.push(`Redacta 3 preguntas de opción múltiple sobre «${t}» y respóndelas consultando el texto oficial (${L.ref}).`);
 return q;}

/* ====== GENERADOR DEL PLAN ======
   - Reparte todas las unidades pendientes de forma proporcional a su carga estimada (Legislación es la más pesada).
   - Intercala materias (interleaving) con un reparto tipo "stride" para que cada materia aparezca a lo largo de todo el periodo.
   - Bloque diario de tarjetas (repaso espaciado), mini-simulacro acumulativo semanal y bloque final de repaso general (2 semanas). */
function generarPlan(desde){
 const s=S.settings;const examen=s.dia1;const inicio=desde||s.inicio;
 const last=addD(parse(examen),-1);const d0=parse(inicio);
 const keep={};
 if(S.plan&&desde){Object.keys(S.plan.days).forEach(k=>{if(k<desde)keep[k]=S.plan.days[k];});}
 const days=[];for(let d=new Date(d0);d<=last;d=addD(d,1))days.push(ymd(d));
 const avisos=[];
 if(!days.length){return{error:'La fecha de inicio debe ser anterior a la fecha del examen (Día uno).'};}
 const N=days.length;
 const R=N>=56?s.repaso:Math.min(s.repaso,Math.max(2,Math.round(N*0.2)));
 if(R<s.repaso)avisos.push(`Quedan ${N} días: el bloque de repaso general se redujo a ${R} días.`);
 const restD=N-R;let f1,f2,f3;
 if(restD>=70){f1=Math.round(restD*0.6);f2=Math.round(restD*0.25);f3=restD-f1-f2;}
 else if(restD>=35){f1=Math.round(restD*0.7);f2=restD-f1;f3=0;}
 else{f1=restD;f2=0;f3=0;if(restD>0)avisos.push('Con el tiempo disponible el plan se concentra en una sola vuelta al temario más el repaso final.');}
 const D1=days.slice(0,f1),D2=days.slice(f1,f1+f2),D3=days.slice(f1+f2,restD),DR=days.slice(restD);
 const fases=[];const addF=(n,arr,desc)=>{if(arr.length)fases.push({n,desc,ini:arr[0],fin:arr[arr.length-1]});};
 addF('Fase 1 · Primera vuelta',D1,'Lectura activa de todo el temario, notas Cornell y primeras tarjetas.');
 addF('Fase 2 · Profundización',D2,'Segunda vuelta: Feynman, preguntas guía sin ver y más tarjetas.');
 addF('Fase 3 · Práctica de examen',D3,'Simulacros por materia y refuerzo de unidades débiles.');
 addF('Fase 4 · Repaso general',DR,'Repaso final intercalado de todas las materias y simulacros generales.');
 const out={};const av=k=>+s.min[dow(parse(k))]||0;
 // plantilla diaria (tarjetas + mini-simulacro semanal) para fases 1 y 2
 const plantilla={};
 [...D1,...D2].forEach((k,i)=>{const a=av(k);const arr=[];let rest=a;
  if(a>0){if(a>=40){arr.push({t:'cards',min:10});rest-=10;}
   if(dow(parse(k))===+s.simDia&&i>=3){const m=Math.min(45,Math.max(20,Math.round(a*0.4)));arr.push({t:'sim',min:m});rest-=m;}}
  plantilla[k]={arr,rest:Math.max(0,rest)};});
 const stride=(partes)=>{const colas={},totM={},pass={};
  MATERIAS.forEach((m,i)=>{colas[m.id]=partes.filter(x=>UMAP[x.u].m===m.id);totM[m.id]=colas[m.id].reduce((a,b)=>a+b.min,0)||1;pass[m.id]=i*0.001;});
  const orden=[];let prev=null;
  while(MATERIAS.some(m=>colas[m.id].length)){const cand=MATERIAS.filter(m=>colas[m.id].length).sort((a,b)=>pass[a.id]-pass[b.id]);
   let m=cand[0];if(cand.length>1&&m.id===prev&&pass[cand[1].id]-pass[m.id]<0.02)m=cand[1];
   const it=colas[m.id].shift();orden.push(it);pass[m.id]+=it.min/totM[m.id]+0.0001;prev=m.id;}
  return orden;};
 const hacerPartes=(items,T,f,tipo,maxP)=>{const W=items.reduce((a,x)=>a+x.w,0)||1;const partes=[];
  items.forEach(it=>{const min=Math.max(15,Math.round(T*f*it.w/W/5)*5);const k=Math.max(1,Math.ceil(min/maxP));const b=Math.round(min/k/5)*5||min;
   for(let i=0;i<k;i++)partes.push({t:tipo,u:it.u.id,min:i===k-1?Math.max(10,min-b*(k-1)):b});});
  return stride(partes);};
 // llena días en orden; no deja fragmentos menores a 15 min
 const llenarDias=(keys,capOf,partes)=>{const q=partes.map(p=>Object.assign({},p));const o={};
  keys.forEach(k=>{let cap=capOf(k);const tasks=[];
   while(q.length&&cap>=15&&tasks.length<4){const p=q[0];
    if(p.min<=cap){tasks.push(Object.assign({},p));cap-=p.min;q.shift();}
    else if(cap>=20&&p.min-cap>=15){tasks.push(Object.assign({},p,{min:cap}));p.min-=cap;cap=0;}
    else break;}
   o[k]=tasks;});
  return{o,left:q};};
 const ajustar=(keys,capOf,items,tipo,maxP,previas)=>{const T=keys.reduce((a,k)=>a+capOf(k),0)-previas.reduce((a,b)=>a+b.min,0);
  let r=null;for(let f=0.95;f>=0.45;f-=0.05){const partes=previas.concat(hacerPartes(items,Math.max(0,T),f,tipo,maxP));r=llenarDias(keys,capOf,partes);if(!r.left.length)break;}
  if(!items.length)r=llenarDias(keys,capOf,previas);
  return r;};
 // FASE 1: primera vuelta (unidades no resumidas; las ya leídas pesan la mitad)
 const it1=UNITS.filter(u=>st(u.id)<2).map(u=>({u,w:u.w*(st(u.id)===1?0.5:1)}));
 const cap12=k=>plantilla[k]?plantilla[k].rest:0;
 const T1=D1.reduce((a,k)=>a+cap12(k),0);
 if(it1.length&&T1<it1.length*25)avisos.push(`El tiempo de la primera vuelta es justo: ~${Math.round(T1/Math.max(1,it1.length))} min por unidad. Considera aumentar minutos diarios.`);
 const r1=ajustar(D1,cap12,it1,'study',45,[]);
 // FASE 2: profundización (unidades no dominadas); primero lo pendiente de la fase 1
 const it2=UNITS.filter(u=>st(u.id)<3).map(u=>({u,w:u.w}));
 const r2=D2.length?ajustar(D2,cap12,it2,'deep',40,r1.left):{o:{},left:r1.left};
 // FASE 3: práctica de examen
 const seqM=(n)=>{const acc={};MATERIAS.forEach(m=>acc[m.id]=0);const tot=MATERIAS.reduce((a,m)=>a+m.peso,0);const sq=[];
  for(let i=0;i<n;i++){let best=null;MATERIAS.forEach(m=>{acc[m.id]+=m.peso;if(!best||acc[m.id]>acc[best])best=m.id;});acc[best]-=tot;sq.push(best);}return sq;};
 const seq=seqM((D3.length+DR.length)*3+12);let si=0;const sig=(evita)=>{let a=seq[si++%seq.length];if(a===evita)a=seq[si++%seq.length];return a;};
 let pendientes=r2.left.filter(t=>t.t==='study');
 if(r2.left.length>pendientes.length)avisos.push('No cupieron todos los bloques de profundización; prioriza las unidades más débiles durante la práctica de examen.');
 const capPend=k=>Math.max(0,av(k)-(av(k)>=40?10:0));
 D1.concat(D2).forEach(k=>{const p=plantilla[k];const tasks=(r1.o[k]||[]).concat(r2.o[k]||[]);

 const pendienteDia=(k)=>{if(!pendientes.length)return null;const r=llenarDias([k],capPend,pendientes);pendientes=r.left;return r.o[k];};
 D3.forEach(k=>{const a=av(k);if(!a){out[k]=[{t:'rest',min:0}];return;}const arr=[];if(a>=40)arr.push({t:'cards',min:10});
  const pend=pendienteDia(k);if(pend&&pend.length){out[k]=arr.concat(pend);return;}
  let r=a-(a>=40?10:0);

  else{const m1=sig(),m2=sig(m1);if(r>=50){const h=Math.round(r/2/5)*5;arr.push({t:'simm',m:m1,min:h},{t:'rev',m:m2,min:r-h});}else arr.push({t:'simm',m:m1,min:r});}

  out[k]=arr;});
 if(pendientes.length)avisos.push('No alcanzó el tiempo para asignar todas las unidades antes del examen. Aumenta los minutos diarios o adelanta la fecha de inicio.');
 // numerar partes por unidad y tipo

 ks.forEach(k=>out[k].forEach(t=>{if(t.u){const c=t.t+t.u;idx[c]=(idx[c]||0)+1;t.p=idx[c];t.n=cuenta[c];}}));

 out[e1]=[{t:'exam',txt:'Día uno: Presentación y Diagnóstico de Inglés'}];

 out[e3]=[{t:'exam',txt:'Día tres: Examen Médico y Capacidad Física'}];
 let c=0;Object.keys(out).forEach(k=>out[k].forEach(t=>t.id='t'+(++c)+'_'+k.replace(/-/g,'')));
 return{plan:{creado:new Date().toISOString(),desde:inicio,inicioRepaso:DR[0]||null,fases,days:Object.assign({},keep,out)},avisos};}

 return '';}

/* ---- Texto a voz (Web Speech API, local) ---- */
function leer(t){if(!('speechSynthesis' in window)){toast('Tu navegador no soporta lectura en voz alta.');return;}speechSynthesis.cancel();const txt=String(t||'').trim();if(!txt){toast('No hay texto para leer.');return;}
 const ut=new SpeechSynthesisUtterance(txt);ut.lang='es-MX';const v=speechSynthesis.getVoices().find(v=>/es[-_]MX/i.test(v.lang))||speechSynthesis.getVoices().find(v=>/^es/i.test(v.lang));if(v)ut.voice=v;ut.rate=1;speechSynthesis.speak(ut);}
function detener(){if('speechSynthesis' in window)speechSynthesis.cancel();}
function leerPreg(id){const d=U(id);leer(preguntas(UMAP[id]).map((q,i)=>q+' '+(d.ans[i]||'')).join('. '));}
/* ====== TARJETAS: repetición espaciada (algoritmo SM-2) ====== */
function cartasPendientes(){const h=hoy();return S.cards.filter(c=>c.due<=h);}
function nuevaCarta(uid){const f=$('#cF').value.trim(),b=$('#cB').value.trim();if(!f||!b){toast('Escribe frente y reverso.');return;}
 S.cards.push({id:'c'+Date.now().toString(36)+Math.random().toString(36).slice(2,5),u:uid,f,b,ef:2.5,iv:0,rep:0,due:hoy(),creada:hoy()});marcaActividad();guardar();render();toast('Tarjeta agregada');}
function borrarCarta(cid){if(!confirm('¿Borrar esta tarjeta?'))return;S.cards=S.cards.filter(c=>c.id!==cid);guardar();render();}
function sm2(c,q){ // q: 0..5
 if(q<3){c.rep=0;c.iv=1;}else{c.rep++;c.iv=c.rep===1?1:c.rep===2?6:Math.round(c.iv*c.ef);}
 c.ef=Math.max(1.3,c.ef+(0.1-(5-q)*(0.08+(5-q)*0.02)));c.due=ymd(addD(new Date(),c.iv));}
let flipped=false,filtroM='';
const segP=k=>`<div class="seg" style="margin-bottom:12px">${[['','🃏 Tarjetas'],['quiz','🎯 Quiz'],['sim','❓ Preguntas guía']].map(([a,b])=>`<button class="${k===a?'on':''}" onclick="location.hash='#practicar${a?'/'+a:''}'">${b}</button>`).join('')}</div>`;
V.practicar=(modo)=>{if(modo==='sim')return vistaSim();if(modo==='quiz')return segP('quiz')+vistaQuizMenu();
 const due=cartasPendientes().filter(c=>!filtroM||UMAP[c.u].m===filtroM);
 let x=segP('');
 x+=`<div class="card hl"><div class="row" style="justify-content:space-between"><h1 style="margin:0">Tarjetas de hoy</h1><span class="tag">${due.length} pendientes · ${S.cards.length} en total</span></div>
 <label>Filtrar por materia</label><select onchange="filtroM=this.value;flipped=false;render()"><option value="">Todas (intercaladas)</option>${MATERIAS.map(m=>`<option value="${m.id}" ${filtroM===m.id?'selected':''}>${esc(m.nombre)}</option>`).join('')}</select></div>`;
 if(!S.cards.length)return x+`<div class="card info">Aún no tienes tarjetas en tu repaso. En cada unidad con texto oficial (Legislación Militar y Uso de la Fuerza) abre la pestaña «🃏 Tarjetas» y toca «Activar». También puedes crear las tuyas en «Mis tarjetas».</div>`;
 if(!due.length)return x+`<div class="card"><p>✅ ¡Al día! No hay tarjetas pendientes${filtroM?' en esta materia':''}. Vuelve mañana.</p></div>`;
 const c=due[0];const u=UMAP[c.u];
 x+=`<div class="card"><div class="small">${tagM(u.m)} <span class="muted">${esc(u.tema)}</span></div>
 <div class="flip ${flipped?'on':''}" id="fl" onclick="voltear()"><div class="in"><div class="fc">${esc(c.f)}</div><div class="fc back">${esc(c.b)}${c.ref?`<span class="ref">${esc(c.ref)}</span>`:''}</div></div></div>`;
 x+=`<div id="pre" class="${flipped?'hide':''}"><p class="muted">Intenta responder en voz alta o por escrito antes de voltear.</p><button class="btn" style="width:100%" onclick="voltear()">Mostrar respuesta</button></div>`;
 x+=`<div id="post" class="${flipped?'':'hide'}"><p class="muted">¿Qué tan bien la recordaste?</p><div class="grid g4"><button class="btn peligro" onclick="calif('${c.id}',1)">Otra vez</button><button class="btn sec" onclick="calif('${c.id}',3)">Difícil</button><button class="btn" onclick="calif('${c.id}',4)">Bien</button><button class="btn" style="background:var(--ok)" onclick="calif('${c.id}',5)">Fácil</button></div></div>`;
 return x+`</div>`;};
function voltear(){flipped=!flipped;const f=$('#fl');if(f)f.classList.toggle('on',flipped);const a=$('#pre'),b=$('#post');if(a)a.classList.toggle('hide',flipped);if(b)b.classList.toggle('hide',!flipped);}
function calif(id,q){const c=S.cards.find(x=>x.id===id);if(!c)return;sm2(c,q);flipped=false;marcaActividad();g().st.cards++;ganaXP(5);guardar();render();}

/* ====== SIMULACRO (práctica de examen con preguntas guía, intercalado) ====== */
let SIM=null;
function vistaSim(){
 let x=segP('sim');
 if(!SIM){const vistos=UNITS.filter(u=>st(u.id)>=1).length;
  x+=`<div class="card hl"><h1>Simulacro</h1><p class="small">Práctica de examen intercalada: la app toma preguntas guía al azar de distintas materias. Responde <b>sin ver el manual</b>, luego compara con tu respuesta guardada o con el texto oficial y califícate con honestidad.</p>
  <label>Origen de las preguntas</label><select id="sOr"><option value="vistas">Unidades que ya leí o más (${vistos})</option><option value="todas">Todo el temario (${UNITS.length})</option>${MATERIAS.map(m=>`<option value="${m.id}">${esc(m.nombre)}</option>`).join('')}</select>
  <label>Número de preguntas</label><select id="sN"><option>10</option><option selected>20</option><option>30</option><option>50</option></select>
  <div class="row" style="margin-top:10px"><button class="btn" onclick="iniciarSim()">Comenzar</button></div></div>`;
  const ult=S.sims.slice(-8).reverse();
  if(ult.length)x+=`<div class="card"><h3>Últimos simulacros</h3>${ult.map(s=>`<div class="task"><div class="tx">${fmt(s.f)} · ${s.n} preguntas</div><span class="min">${s.pct}% bien</span></div>`).join('')}</div>`;
  return x;}
 if(SIM.i>=SIM.qs.length){const ok=SIM.res.filter(r=>r===2).length,re=SIM.res.filter(r=>r===1).length;const p=pct(ok+re*0.5,SIM.qs.length);
  const malas=SIM.qs.filter((q,i)=>SIM.res[i]===0).map(q=>q.u);const uniq=[...new Set(malas)];
  x+=`<div class="card hl"><h1>Resultado: ${p}%</h1><p>${ok} bien · ${re} regular · ${SIM.qs.length-ok-re} por reforzar</p>${uniq.length?`<h3>Unidades a reforzar</h3>${uniq.map(id=>`<div class="unit" onclick="location.hash='#unidad/${id}'"><span class="nm">${tagM(UMAP[id].m)} ${esc(UMAP[id].tema)}</span><span class="pill st${st(id)}">${ESTADOS[st(id)]}</span></div>`).join('')}`:''}
  <div class="row" style="margin-top:10px"><button class="btn" onclick="SIM=null;render()">Terminar</button></div></div>`;return x;}
 const q=SIM.qs[SIM.i];const u=UMAP[q.u];const guardada=(S.units[q.u]&&S.units[q.u].ans[q.k])||'';
 x+=`<div class="card"><div class="row" style="justify-content:space-between"><span class="tag">Pregunta ${SIM.i+1}/${SIM.qs.length}</span>${tagM(u.m)}</div>
 <p class="small muted" style="margin:8px 0 2px">${esc(u.libro.nombre)} · ${esc(u.completo?u.grupo:u.titulo)}</p><div class="q" style="font-size:1rem">${esc(preguntas(u)[q.k])}</div>
 <textarea id="simR" placeholder="Responde de memoria..."></textarea>`;
 if(!SIM.show)x+=`<div class="row" style="margin-top:8px"><button class="btn" onclick="SIM.show=true;render()">Comparar</button></div>`;
 else x+=`<div class="card info" style="margin-top:8px"><b>Tu respuesta guardada en la unidad:</b><br>${guardada?esc(guardada).replace(/\n/g,'<br>'):'<span class="muted">Aún no la has escrito. Verifica en el texto oficial y guárdala en la unidad.</span>'}</div>
  <div class="grid g3"><button class="btn peligro" onclick="calSim(0)">Por reforzar</button><button class="btn sec" onclick="calSim(1)">Regular</button><button class="btn" onclick="calSim(2)">Bien</button></div>`;
 return x+`</div>`;}
function iniciarSim(){const o=$('#sOr').value,n=+$('#sN').value;let pool=o==='vistas'?UNITS.filter(u=>st(u.id)>=1):o==='todas'?UNITS:UNITS.filter(u=>u.m===o);
 if(!pool.length){toast('Aún no hay unidades marcadas como leídas. Elige «Todo el temario».');return;}
 const qs=[];const all=[];pool.forEach(u=>preguntas(u).forEach((_,k)=>{if(k<6)all.push({u:u.id,k});}));
 for(let i=all.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[all[i],all[j]]=[all[j],all[i]];}
 // intercalar: evitar dos seguidas de la misma materia cuando sea posible
 while(qs.length<Math.min(n,all.length)){let j=all.findIndex(a=>!qs.length||UMAP[a.u].m!==UMAP[qs[qs.length-1].u].m);if(j<0)j=0;qs.push(all.splice(j,1)[0]);}
 SIM={qs,i:0,res:[],show:false};render();}
function calSim(v){SIM.res[SIM.i]=v;SIM.i++;SIM.show=false;marcaActividad();
 if(SIM.i>=SIM.qs.length){const ok=SIM.res.filter(r=>r===2).length,re=SIM.res.filter(r=>r===1).length;S.sims.push({f:hoy(),n:SIM.qs.length,pct:pct(ok+re*0.5,SIM.qs.length)});}
 guardar();render();}

const mmss=ms=>{const s=Math.round(ms/1000);return pad(Math.floor(s/60))+':'+pad(s%60);};
function pomoStart(modo){const p=S.pomo;const m=($('#pM')&&$('#pM').value)||p.lastM||'LM';const u=($('#pU')&&$('#pU').value)||'';
 const dur=(modo==='work'?p.work:modo==='short'?p.short:p.long)*60000;
 S.pomoRun={modo,ini:Date.now(),fin:Date.now()+dur,m,u};p.lastM=m;guardar();
 if('Notification' in window&&Notification.permission==='default')try{Notification.requestPermission();}catch(e){}
 tick();render();}
function pomoUnidad(id){S.pomo.lastM=UMAP[id].m;S.pomo.lastU=id;guardar();location.hash='#pomodoro';}
function logMin(m,u,min,k){if(min<1)return;S.logs.push({f:hoy(),m,u,min:Math.round(min),k});marcaActividad();ganaXP(Math.round(min));}
function pomoStop(){const r=S.pomoRun;if(r&&r.modo==='work'){const min=(Date.now()-r.ini)/60000;if(min>=1){logMin(r.m,r.u,min,'parcial');toast(`Se registraron ${Math.round(min)} min`);}}S.pomoRun=null;guardar();render();}
function registroManual(){const v=+$('#manMin').value;if(!v){toast('Escribe los minutos.');return;}logMin(($('#pM')&&$('#pM').value)||'GEN','',v,'manual');guardar();toast('Tiempo registrado');render();}
function beep(){try{const a=new (window.AudioContext||window.webkitAudioContext)();[0,0.35,0.7].forEach(t=>{const o=a.createOscillator(),g=a.createGain();o.frequency.value=880;o.connect(g);g.connect(a.destination);g.gain.setValueAtTime(0.2,a.currentTime+t);g.gain.exponentialRampToValueAtTime(0.001,a.currentTime+t+0.3);o.start(a.currentTime+t);o.stop(a.currentTime+t+0.3);});}catch(e){}
 if(navigator.vibrate)navigator.vibrate([200,100,200]);}
function avisar(t){beep();toast(t);try{if('Notification' in window&&Notification.permission==='granted')new Notification('Plan de Ascenso',{body:t});}catch(e){}}
function tick(){clearInterval(pomoInt);pomoInt=setInterval(()=>{const r=S.pomoRun;const bar=$('#pomoBar');
  if(!r){bar.style.display='none';clearInterval(pomoInt);return;}
  const left=r.fin-Date.now();bar.style.display='block';bar.textContent=`${r.modo==='work'?'⏱ Concentración':'☕ Descanso'} · ${mmss(Math.max(0,left))} · ${r.m}`;
  const t=$('#tmr');if(t)t.textContent=mmss(Math.max(0,left));
  if(left<=0){const p=S.pomo;
   if(r.modo==='work'){logMin(r.m,r.u,p.work,'pomo');p.count++;const largo=p.count%p.every===0;S.pomoRun={modo:largo?'long':'short',ini:Date.now(),fin:Date.now()+(largo?p.long:p.short)*60000,m:r.m,u:r.u};avisar(largo?'¡Pomodoro completo! Descanso largo.':'¡Pomodoro completo! Toma un descanso.');}
   else{S.pomoRun=null;avisar('Fin del descanso. ¿Listo el siguiente pomodoro?');}
   guardar();if(location.hash==='#pomodoro'||location.hash==='#inicio'||location.hash==='')render();}},500);}

function descargar(nombre,tipo,txt){const b=new Blob([txt],{type:tipo});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=nombre;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500);}

function importar(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const x=JSON.parse(r.result);if(!x||x.v!==1)throw 0;if(!confirm('Esto reemplazará los datos actuales por los del respaldo. ¿Continuar?'))return;S=Object.assign(nuevoEstado(),x);guardar();render();tick();toast('Respaldo importado ✔');}catch(e){toast('Archivo no válido.');}};r.readAsText(f);}

 const icsEsc=t=>t.replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\n/g,'\\n');
 const stamp=new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d+/,'');

 cfg.uids.forEach(u=>{const c=CONT(u);if(!c||!c.quiz)return;const z=S.qz&&S.qz[u];const ns=cfg.cap&&capSel?nsCap(u):null;c.quiz.forEach((q,i)=>{if(ns&&!ns.has(q.n))return;if(cfg.modo==='sim'&&q.tipo==='abierta')return;if(cfg.modo==='errores'&&!(z&&z.err[i]))return;if(cfg.pend&&z&&z.ok[i])return;pool.push({u,i});});});
 if(!pool.length){toast(cfg.modo==='errores'?'No tienes errores pendientes 🎉':'No hay preguntas disponibles con ese filtro.');return;}
 shuffle(pool);
 if(cfg.uids.length>1){// intercalar unidades: evitar dos seguidas de la misma unidad
  const out=[];while(pool.length&&out.length<cfg.n){let j=pool.findIndex(p=>!out.length||p.u!==out[out.length-1].u);if(j<0)j=0;out.push(pool.splice(j,1)[0]);}pool=out;}
 const items=pool.slice(0,cfg.n);
 QZ={modo:cfg.modo,items,i:0,res:[],resp:null,t0:Date.now(),fin:cfg.min?Date.now()+cfg.min*60000:0,exam:cfg.modo==='sim',xp:0,volver:location.hash||'#practicar/quiz'};
 clearInterval(qzInt);if(QZ.fin)qzInt=setInterval(tickQuiz,500);
 if(location.hash==='#quiz')render();else location.hash='#quiz';}
function tickQuiz(){if(!QZ||!QZ.fin){clearInterval(qzInt);return;}const r=QZ.fin-Date.now();const e=$('#qzT');
 if(r<=0){clearInterval(qzInt);QZ.timeout=true;terminarQuiz();return;}
 if(e){const m=Math.floor(r/60000),s=Math.floor(r/1000)%60;e.textContent=`⏱ ${m}:${pad(s)}`;e.classList.toggle('low',r<60000);}}
function qAct(){const it=QZ.items[QZ.i];return{it,q:CONT(it.u).quiz[it.i]};}
function fundamento(u,q){const c=CONT(u),E=etq(u),f=FUENTE(u);const a=(c.art||[]).find(x=>x.n===q.n);const t=a?a.t.filter(p=>!p.startsWith('§ ')).join(' '):'';
 let s=`<b>📜 Fundamento: ${esc(E)} ${esc(q.n)}${a&&a.pag?`, pág. ${esc(a.pag)}`:''} (${esc(f.abbr||f.nombre)})</b>`;
 if(q.tipo==='vf'&&q.a===false&&q.nota)s+=`<br>${esc(q.nota)}`;
 if(q.tipo==='vf'&&q.a===false&&q.real)s+=`<br>El texto citado corresponde en realidad al <b>${esc(E)} ${esc(q.real)}</b>.`;
 if(q.tipo!=='mc'&&q.tipo!=='vf')s+=`<br>Respuesta: <b>${esc(q.a)}</b>`;
 if(t)s+=`<br><span class="small">«${esc(t.length>420?t.slice(0,420).replace(/\s\S*$/,'')+'…':t)}»</span>`;
 return s+`<br><a href="javascript:void 0" class="small" onclick="irArt('${u}','${esc(q.n)}')">Leer el ${E==='Art.'?'artículo':'párrafo'} completo →</a>`;}
V.quiz=()=>{if(!QZ)return `<div class="card">No hay un quiz en curso. <a href="#practicar/quiz">Elegir modo</a>.</div>`;

 <div class="q" style="font-size:1rem;margin-top:10px">${q.tipo==='vf'?'¿Verdadero o falso? ':''}${esc(q.q)}</div>`;
 const dis=r?'disabled':'';
 if(q.tipo==='mc'||(q.tipo==='blank'&&q.ops)){x+=q.ops.map((o,k)=>{let cl='';if(r){if(o===q.a)cl='ok';else if(r.val===k)cl='bad';}return `<button class="opt ${cl}" ${dis} onclick="qzResp(${k},this)"><span class="lt">${String.fromCharCode(65+k)}</span><span>${esc(o)}</span></button>`;}).join('');}
 else if(q.tipo==='vf'){x+=`<div class="grid g2">${['Verdadero','Falso'].map((o,k)=>{let cl='';if(r){const corr=(k===0)===q.a;if(corr)cl='ok';else if(r.val===k)cl='bad';}return `<button class="opt ${cl}" style="justify-content:center;flex-direction:column;gap:6px;min-height:84px" ${dis} onclick="qzResp(${k},this)"><span class="lt">${k?'✗':'✓'}</span>${o}</button>`;}).join('')}</div>`;}
 else if(q.tipo==='blank'){x+=`<input id="qzIn" placeholder="Escribe la palabra o frase que falta" ${dis} value="${r?esc(r.txt||''):''}" onkeydown="if(event.key==='Enter')qzTxt()"><div class="row" style="margin-top:8px">${r?'':`<button class="btn" onclick="qzTxt()">Comprobar</button>`}</div>`;}
 else{ // abierta: autoevaluación
  x+=`<textarea id="qzIn" placeholder="Responde de memoria (opcional escribir)" ${dis}>${r?esc(r.txt||''):''}</textarea>`;
  if(!r&&!QZ.ver)x+=`<div class="row" style="margin-top:8px"><button class="btn" onclick="QZ.ver=1;QZ.txt=$('#qzIn').value;render()">Ver respuesta</button></div>`;
  else if(!r)x+=`<div class="fb ok">Respuesta del texto: <b>${esc(q.a)}</b></div><p class="muted small">¿Tu respuesta coincidía en lo esencial?</p><div class="grid g2"><button class="btn peligro" onclick="qzMarca(false)">No</button><button class="btn" onclick="qzMarca(true)">Sí</button></div>`;}
 if(r&&!QZ.exam)x+=`<div class="fb ${r.ok?'ok':'bad'}"><div class="fbh">${r.ok?'✅ '+frase(OKS,QZ.i*3+QZ.res.filter(Boolean).length)+' <span class="tag">+10 XP</span>':'💡 '+frase(BADS,QZ.i)}</div>${fundamento(it.u,q)}</div>${r.dudosa?`<div class="row" style="margin-top:6px"><button class="btn sm sec" onclick="qzCorrige()">Mi respuesta era equivalente: contarla como correcta</button></div>`:''}<div class="row" style="margin-top:10px"><button class="btn" style="flex:1" onclick="qzSig()">${QZ.i+1<QZ.items.length?'Siguiente ▶':'Ver resultado'}</button></div>`;
 x+=`</div><div class="row"><button class="btn sm sec" onclick="if(confirm('¿Terminar el quiz ahora?'))terminarQuiz()">Terminar</button></div>`;

function cierraQuiz(){if(QZ.tf!=null)return;clearInterval(qzInt);QZ.i=QZ.items.length;QZ.tf=Date.now();
 const ok=QZ.res.filter(Boolean).length,tot=QZ.items.length;const p=pct(ok,tot);
 if(QZ.exam){S.sims.push({f:hoy(),n:tot,pct:p,tipo:'cronometrado'});const G=g();if(p>=80)G.st.sim80=1;if(p===100&&tot>=10)G.st.sim100=1;ganaXP(20);}

 let x=`<div class="card hl" style="text-align:center"><div style="display:flex;justify-content:center">${ring(p,96,p>=80?'var(--ok)':p>=60?'var(--warn)':'var(--mal)')}</div><h1>${p>=90?'¡Excelente!':p>=80?'¡Aprobada con honores!':p>=60?'Buen trabajo':'A reforzar'} · ${p}%</h1>

 if(malos.length)x+=`<div class="card"><h3>Revisa tus errores (${malos.length})</h3>${malos.map(o=>{const q=CONT(o.it.u).quiz[o.it.i];return `<div class="fb bad" style="margin:10px 0"><div class="small">${tagM(UMAP[o.it.u].m)}</div><b>${q.tipo==='vf'?'V/F: ':''}${esc(q.q)}</b><br>${q.tipo==='mc'||q.tipo==='blank'?`Correcta: <b>${esc(q.a)}</b><br>`:q.tipo==='vf'?`Correcta: <b>${q.a?'Verdadero':'Falso'}</b><br>`:''}${fundamento(o.it.u,q)}</div>`;}).join('')}</div>`;

const IDB={db:null,open(){return new Promise((ok,ko)=>{if(this.db)return ok(this.db);if(!('indexedDB' in window))return ko('sin IndexedDB');const r=indexedDB.open('planAscensoPrivado',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>{this.db=r.result;ok(this.db);};r.onerror=()=>ko(r.error);});},
 async get(k){const db=await this.open();return new Promise((ok,ko)=>{const t=db.transaction('kv').objectStore('kv').get(k);t.onsuccess=()=>ok(t.result);t.onerror=()=>ko(t.error);});},
 async set(k,v){const db=await this.open();return new Promise((ok,ko)=>{const tx=db.transaction('kv','readwrite');tx.objectStore('kv').put(v,k);tx.oncomplete=()=>ok();tx.onerror=()=>ko(tx.error);});},
 async keys(){const db=await this.open();return new Promise((ok,ko)=>{const t=db.transaction('kv').objectStore('kv').getAllKeys();t.onsuccess=()=>ok(t.result);t.onerror=()=>ko(t.error);});},
 async del(k){const db=await this.open();return new Promise((ok,ko)=>{const tx=db.transaction('kv','readwrite');tx.objectStore('kv').delete(k);tx.oncomplete=()=>ok();tx.onerror=()=>ko(tx.error);});}};
function validaPack(x){if(!x||typeof x!=='object'||!x.unidades||typeof x.unidades!=='object')throw new Error('Falta el objeto «unidades».');
 const out={formato:'plan-ascenso-paquete',id:slug(x.id||x.nombre||'contenido-privado'),nombre:String(x.nombre||'Contenido privado'),importado:hoy(),ts:Date.now(),fuentes:{},unidades:{}},ign=[];
 Object.entries(x.fuentes||{}).forEach(([k,f])=>{if(f&&typeof f==='object')out.fuentes[k]={nombre:String(f.nombre||k),abbr:String(f.abbr||k),reforma:f.reforma?String(f.reforma):'',guia:f.guia?String(f.guia):'',nota:f.nota?String(f.nota):'',ejemplar:f.ejemplar?String(f.ejemplar):'',etiqueta:f.etiqueta?String(f.etiqueta):'',url:/^https?:\/\//.test(f.url||'')?String(f.url):''};});
 const S_=v=>String(v==null?'':v);
 Object.entries(x.unidades).forEach(([id,u])=>{if(!UMAP[id]||!u||typeof u!=='object'){ign.push(id);return;}
  const art=(Array.isArray(u.art)?u.art:[]).filter(a=>a&&a.n!=null).map(a=>({n:S_(a.n),t:(Array.isArray(a.t)?a.t:[a.t]).map(S_).filter(Boolean),sec:S_(a.sec),cap:S_(a.cap),pag:S_(a.pag)}));
  const quiz=(Array.isArray(u.quiz)?u.quiz:[]).filter(q=>q&&['mc','vf','blank','abierta'].includes(q.tipo)&&q.q!=null&&q.a!=null).map(q=>{const o={tipo:q.tipo,q:S_(q.q),a:q.tipo==='vf'?!!q.a:S_(q.a),n:S_(q.n)};if(Array.isArray(q.ops)&&q.ops.length>=2){o.ops=q.ops.map(S_);if(!o.ops.includes(o.a))o.ops.push(o.a);}if(q.tipo==='mc'&&!o.ops)return null;if(q.real)o.real=S_(q.real);if(q.nota)o.nota=S_(q.nota);if(q.num)o.num=1;if(q.cap)o.cap=S_(q.cap);return o;}).filter(Boolean);
  out.unidades[id]={fuente:S_(u.fuente||Object.keys(out.fuentes)[0]||'Privado'),encabezados:(Array.isArray(u.encabezados)?u.encabezados:[]).map(h=>({label:S_(h.label),name:S_(h.name)})),art,

 if(!Object.keys(out.unidades).length)throw new Error('Ninguna unidad del paquete coincide con el temario.');

 <div class="card"><h3>Metas y sonido</h3><div class="sw"><span class="small">Meta diaria (XP)</span><input type="number" min="20" step="10" value="${G.meta}" style="width:100px" onchange="g().meta=Math.max(20,+this.value||100);guardar();render()"></div><div class="sw"><span class="small">Meta semanal (XP)</span><input type="number" min="100" step="50" value="${metaSem()}" style="width:100px" onchange="g().metaSem=Math.max(100,+this.value||500);guardar();render()"></div><div class="sw"><span class="small">Sonidos en quiz y sesión</span><button class="tog ${G.sonido?'on':''}" onclick="toggleSonido()" aria-label="Sonido"></button></div>
 <p class="muted small" style="margin-bottom:0">XP: acierto +10 · fallo +2 · lectura +3 (en sesión) · tarjeta +5 · minuto de estudio +1 · sesión completa +15 · reto del día +25 · simulacro +20 · unidad «Dominado» +30.</p></div>
 <div class="card"><h3>Tu tiempo de estudio <span class="muted">(${totH} h)</span></h3><div class="chart">${MATERIAS.map(m=>{const v=minM[m.id]||0;return `<div class="r"><span>${esc(corto(m))}</span><div class="bar" style="height:12px"><i style="width:${pct(v,maxM)}%;background:${gradM(m)}"></i></div><span>${(v/60).toFixed(1)} h</span></div>`;}).join('')}</div><p class="muted small" style="margin-bottom:0">Se registra con la sesión guiada, el Pomodoro o el registro manual.</p></div>`;};

/* --- MÁS --- */
V.mas=()=>{const T=[['#plan','📅','Plan semanal','Tu calendario'],['#pomodoro','🍅','Pomodoro','Foco y descansos'],['#temario','📋','Temario en lista','Estados por unidad'],['#subrayados','🖍️','Subrayados',`${(g().subr||[]).length} guardados`],['#tecnicas','🧠','Técnicas','Cómo estudiar mejor'],['#herramientas','🔗','Fuentes oficiales','Leyes y apps'],['#ingles','🇺🇸','Inglés','Práctica diaria'],['#fisico','🏃‍♀️','Capacidad física','Registro semanal'],['#setup','⚙️','Configurar plan','Fechas y minutos'],['#ajustes','🔐','Datos y paquetes','Respaldo y privado']];
 return `<h1 style="margin:4px 4px 12px">Más</h1><div class="tiles">${T.map(([h,ic,t,s],i)=>`<a class="tile" href="${h}"><div style="width:44px;height:44px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:1.4rem;background:linear-gradient(135deg,${BCOL[i%BCOL.length]}22,${BCOL[(i+1)%BCOL.length]}33);margin-bottom:8px">${ic}</div><b>${t}</b><div class="lbl">${s}</div></a>`).join('')}</div>`;};
V.subrayados=()=>{const L=(g().subr||[]).slice().reverse();return `<div class="card hl"><h1>🖍 Mis subrayados</h1><p class="muted small" style="margin:0">Selecciona texto en la lectura (tarjetas o texto completo) y toca «Guardar subrayado».</p></div>`+(L.length?L.map(s=>{const u=UMAP[s.u];return u?`<div class="subr" style="background:var(--blanco);box-shadow:var(--sombra)">«${esc(s.t)}»<div class="row small" style="margin-top:6px">${tagM(u.m)}<a href="javascript:void 0" onclick="irArt('${s.u}','${esc(s.n)}')">${esc(etq(s.u))} ${esc(s.n)} · ${esc(u.tema.slice(0,40))}</a><span style="flex:1"></span><button class="btn sm sec" onclick="borraSubr('${s.id}')">Quitar</button></div></div>`:'';}).join(''):`<div class="card muted">Aún no tienes subrayados.</div>`);};

/* ====== INICIO ====== */
aplicaTema();render();cargarPack();if(S.pomoRun)tick();
if(!S.settings&&!location.hash)location.hash='#inicio';
if('serviceWorker' in navigator&&/^https?:/.test(location.protocol)){navigator.serviceWorker.register('sw.js').catch(()=>{});}
</script>
</body>
</html>

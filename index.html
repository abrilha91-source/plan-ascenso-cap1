<style>
:root{
  --verde:#4b5320; --verde-osc:#3d4a1f; --verde-2:#5f6b34; --verde-cl:#e7eadb; --fondo:#f4f5ef;
  --caqui:#b5a26b; --caqui-cl:#efe9d4; --texto:#1f2418; --gris:#6b6f60; --borde:#d5d8c8;
  --ok:#3f7a3a; --warn:#a86b12; --mal:#9b2c2c; --blanco:#fff;
  --r:10px; --sombra:0 1px 3px rgba(0,0,0,.08);
}
*{box-sizing:border-box}
html{font-size:10.5pt;-webkit-text-size-adjust:100%}
body{margin:0;font-family:'Noto Sans',system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;background:var(--fondo);color:var(--texto);line-height:1.45;padding-bottom:calc(64px + env(safe-area-inset-bottom))}
a{color:var(--verde-osc)}
h1,h2,h3{margin:.2em 0 .5em;line-height:1.25}
h1{font-size:1.35rem} h2{font-size:1.15rem} h3{font-size:1rem}
header.top{position:sticky;top:0;z-index:20;background:var(--verde-osc);color:#f3f1e4;padding:10px 14px calc(10px);display:flex;align-items:center;gap:10px;box-shadow:0 2px 4px rgba(0,0,0,.15)}
header.top .logo{width:30px;height:30px;flex:none}
header.top .tt{font-weight:700;font-size:1rem;line-height:1.1}
header.top .st{font-size:.78rem;opacity:.85}
header.top .sp{flex:1}
#pomoBar{display:none;background:var(--caqui);color:#1f2418;padding:6px 14px;font-weight:600;font-size:.9rem;cursor:pointer;position:sticky;top:50px;z-index:19}
main{max-width:860px;margin:0 auto;padding:12px}
.card{background:var(--blanco);border:1px solid var(--borde);border-radius:var(--r);padding:12px 14px;margin:0 0 12px;box-shadow:var(--sombra)}
.card.hl{border-left:5px solid var(--verde)}
.card.warn{border-left:5px solid var(--warn);background:#fff8ec}
.card.info{border-left:5px solid var(--caqui);background:var(--caqui-cl)}
.grid{display:grid;gap:10px}
.g2{grid-template-columns:1fr 1fr} .g3{grid-template-columns:repeat(3,1fr)} .g4{grid-template-columns:repeat(4,1fr)}
@media (max-width:520px){.g4{grid-template-columns:1fr 1fr}.g3.r{grid-template-columns:1fr}}
.stat{background:var(--verde-cl);border-radius:8px;padding:8px 10px;text-align:center}
.stat b{display:block;font-size:1.45rem;color:var(--verde-osc)}
.stat span{font-size:.78rem;color:var(--gris)}
.btn{appearance:none;border:1px solid var(--verde);background:var(--verde);color:#fff;border-radius:8px;padding:8px 12px;font:inherit;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px;text-decoration:none;min-height:38px}
.btn.sec{background:#fff;color:var(--verde-osc)}
.btn.sm{padding:4px 9px;min-height:30px;font-size:.88rem}
.btn.peligro{background:var(--mal);border-color:var(--mal)}
.btn:disabled{opacity:.5;cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.muted{color:var(--gris);font-size:.88rem}
.small{font-size:.85rem}
label{font-weight:600;font-size:.9rem;display:block;margin:6px 0 3px}
input,select,textarea{font:inherit;width:100%;padding:7px 9px;border:1px solid var(--borde);border-radius:7px;background:#fff;color:var(--texto)}
textarea{min-height:80px;resize:vertical}
input[type=checkbox]{width:auto;transform:scale(1.25);accent-color:var(--verde)}
.bar{height:9px;background:#e3e5d8;border-radius:5px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--verde);border-radius:5px}
.tag{display:inline-block;font-size:.74rem;padding:1px 7px;border-radius:10px;background:var(--verde-cl);color:var(--verde-osc);font-weight:600}
.tag.k{background:var(--caqui-cl);color:#6a5a26}
.task{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px dashed var(--borde)}
.task:last-child{border-bottom:0}
.task .tx{flex:1}
.task.done .tx{opacity:.55;text-decoration:line-through}
.task .min{font-size:.8rem;color:var(--gris);white-space:nowrap}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;margin-right:4px;vertical-align:middle}
nav.tabs{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--borde);display:flex;z-index:30;padding-bottom:env(safe-area-inset-bottom)}
nav.tabs a{flex:1;text-align:center;padding:7px 2px 6px;text-decoration:none;color:var(--gris);font-size:.72rem;font-weight:600}
nav.tabs a svg{display:block;margin:0 auto 2px;width:22px;height:22px}
nav.tabs a.on{color:var(--verde-osc)}
nav.tabs a.on svg{stroke:var(--verde-osc)}
.seg{display:flex;border:1px solid var(--verde);border-radius:8px;overflow:hidden;flex-wrap:wrap}
.seg button{flex:1;border:0;background:#fff;color:var(--verde-osc);padding:7px 4px;font:inherit;font-size:.85rem;font-weight:600;cursor:pointer;min-width:70px}
.seg button.on{background:var(--verde);color:#fff}
.st0{color:#8a8d80}.st1{color:#8a6d1c}.st2{color:#2f6a8a}.st3{color:var(--ok)}
.unit{display:flex;gap:8px;align-items:center;padding:8px 2px;border-bottom:1px solid #eef0e6;cursor:pointer}
.unit:hover{background:#fafbf6}
.unit .nm{flex:1;font-size:.92rem}
.pill{font-size:.72rem;border-radius:10px;padding:1px 8px;border:1px solid currentColor;white-space:nowrap;font-weight:600}
details>summary{cursor:pointer;font-weight:700;padding:4px 0}
.week{display:grid;gap:8px}
.day{background:#fff;border:1px solid var(--borde);border-radius:8px;padding:8px 10px}
.day.today{border:2px solid var(--verde)}
.day h4{margin:0 0 4px;font-size:.92rem;display:flex;justify-content:space-between}
.chart .r{display:grid;grid-template-columns:110px 1fr 52px;gap:6px;align-items:center;margin:5px 0;font-size:.84rem}
.flash{min-height:150px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:1.1rem;padding:18px;background:#fff;border:2px solid var(--verde-cl);border-radius:12px;white-space:pre-wrap}
.timer{font-size:3.4rem;font-weight:700;text-align:center;color:var(--verde-osc);font-variant-numeric:tabular-nums;letter-spacing:1px}
.cornell{display:grid;grid-template-columns:34% 1fr;gap:8px}
.cornell .sum{grid-column:1/3}
.aviso{background:#fff3d6;border:1px solid #e5c67a;border-radius:8px;padding:8px 10px;font-size:.86rem}
table.hab{border-collapse:collapse;width:100%;font-size:.85rem}
table.hab th,table.hab td{border:1px solid var(--borde);padding:5px;text-align:center}
table.hab td:first-child,table.hab th:first-child{text-align:left}
.list li{margin:4px 0}
.hide{display:none!important}
.q{margin:10px 0 4px;font-weight:600;font-size:.93rem}
.toast{position:fixed;left:50%;bottom:80px;transform:translateX(-50%);background:#232a17;color:#fff;padding:9px 14px;border-radius:8px;z-index:50;font-size:.9rem;max-width:90%}
.mas a.card{display:block;text-decoration:none;color:inherit}
@media print{nav.tabs,header.top,#pomoBar{display:none}}
</style>
</head>

 if(t.done){marcaActividad();if(t.t==='study'&&t.p===t.n){const x=U(t.u);if(x.st<1){x.st=1;toast('Unidad marcada como «Leído». Actualiza su estado en Temario cuando la resumas o domines.');}}}
 guardar();render();}
function filaTarea(k,t,ctrl=true){
 const m=materiaTarea(t);const c=m?MMAP[m].color:'#b5a26b';
 const btn=(t.t==='study'||t.t==='deep')?` <a class="btn sm sec" href="#unidad/${t.u}">Abrir</a>`:t.t==='cards'?` <a class="btn sm sec" href="#practicar">Repasar</a>`:(t.t==='sim'||t.t==='simg'||t.t==='simm')?` <a class="btn sm sec" href="#practicar/sim">Iniciar</a>`:t.t==='rev'?` <a class="btn sm sec" href="#temario/${t.m}">Ver</a>`:'';
 const chk=ctrl&&!['rest','exam'].includes(t.t)?`<input type="checkbox" ${t.done?'checked':''} onchange="toggleTarea('${k}','${t.id}',this)" aria-label="Hecho">`:`<span style="width:18px"></span>`;
 return `<div class="task ${t.done?'done':''}">${chk}<span class="dot" style="background:${c};margin-top:6px"></span><div class="tx">${textoTarea(t)}${btn}</div>${t.min?`<span class="min">${t.min} min</span>`:''}</div>`;}
/* ====== VISTAS ====== */
const V={};
function render(){const h=(location.hash||'#inicio').slice(1);const[r,...a]=h.split('/');
 const f=V[r]||V.inicio;const main=$('#main');main.innerHTML=f(...a.map(decodeURIComponent));
 const tab={inicio:'inicio',setup:'inicio',plan:'plan',temario:'temario',unidad:'temario',practicar:'practicar',pomodoro:'pomodoro'}[r]||'mas';
 document.querySelectorAll('nav.tabs a').forEach(x=>x.classList.toggle('on',x.dataset.r===tab));
 if(V['_after_'+r])V['_after_'+r](...a);}
window.addEventListener('hashchange',()=>{render();window.scrollTo(0,0);});

V.inicio=()=>{
 if(!S.settings)return `<div class="card hl"><h1>¡Bienvenida, Capitán!</h1><p>Esta app es tu tutor para la <b>Promoción General 2026</b> rumbo a <b>Capitán Primero Enfermera</b>. Contiene el temario oficial completo (apéndice Cap. 2/o. Enfermera) y te arma un calendario semanal con técnicas de estudio probadas.</p><p class="muted">Tus datos se guardan solo en este dispositivo. Nada se envía a internet.</p><a class="btn" href="#setup">Configurar mi plan</a></div>`+resumenTemario();
 const h=hoy();const dl=diffD(h,S.settings.dia1);const due=cartasPendientes().length;
 const tareas=tareasDe(h);const atr=atrasadas();
 const minM={};S.logs.forEach(l=>{minM[l.m]=(minM[l.m]||0)+l.min;});const maxM=Math.max(60,...Object.values(minM));
 const totH=(Object.values(minM).reduce((a,b)=>a+b,0)/60).toFixed(1);
 let x=`<div class="grid g4" style="margin-bottom:12px">
  <div class="stat"><b>${dl>=0?dl:0}</b><span>días para el examen${S.settings.dia1===FECHA_PROBABLE?' (fecha probable)':''}</span></div>
  <div class="stat"><b>${progGlobal()}%</b><span>avance del temario</span></div>
  <div class="stat"><b>${due}</b><span>tarjetas para hoy</span></div>
  <div class="stat"><b>${racha()}🔥</b><span>días de racha</span></div></div>`;
 if(dl<0)x+=`<div class="card info">La fecha del Día uno (${fmt(S.settings.dia1)}) ya pasó. Si hay nueva fecha, actualízala en <a href="#setup">Configurar plan</a>.</div>`;
 if(atr.length)x+=`<div class="card warn"><b>Vas ${atr.length} bloque(s) atrasada.</b> No pasa nada: recalcula y la app redistribuye lo pendiente desde hoy.<div class="row" style="margin-top:8px"><button class="btn" onclick="recalcular()">Recalcular desde hoy</button></div></div>`;
 const fz=faseDe(h);if(fz)x+=`<div class="card info small"><b>${esc(fz.n)}</b> · hasta el ${fmt(fz.fin)}<br>${esc(fz.desc)}</div>`;
 x+=`<div class="card hl"><h2>Hoy · ${fmt(h)}</h2>${tareas.length?tareas.map(t=>filaTarea(h,t)).join(''):'<p class="muted">Sin tareas programadas para hoy.</p>'}
  <div class="row" style="margin-top:8px"><a class="btn" href="#pomodoro">▶ Iniciar Pomodoro</a>${due?`<a class="btn sec" href="#practicar">Repasar ${due} tarjeta(s)</a>`:''}</div></div>`;
 x+=`<div class="card"><h2>Hábitos de hoy</h2><div class="row"><label class="row" style="font-weight:400"><input type="checkbox" ${S.habits.ingles[h]?'checked':''} onchange="habIngles(this.checked)"> Inglés 10–15 min</label> <a class="small" href="#ingles">ideas</a></div>
  <div class="row"><label class="row" style="font-weight:400"><input type="checkbox" ${S.habits.fisico[h]&&Object.values(S.habits.fisico[h]).some(Boolean)?'checked':''} onchange="habFisicoRapido(this.checked)"> Actividad física</label> <a class="small" href="#fisico">registro semanal</a></div></div>`;
 x+=`<div class="card"><h2>Avance por materia</h2>${MATERIAS.map(m=>`<div style="margin:7px 0"><div class="row" style="justify-content:space-between"><a href="#temario/${m.id}" class="small" style="font-weight:600;text-decoration:none;color:${m.color}">${esc(m.nombre)}</a><span class="small">${progMateria(m)}%</span></div>${barra(progMateria(m),m.color)}</div>`).join('')}
  <div style="margin-top:10px"><div class="row" style="justify-content:space-between"><b class="small">Global</b><span class="small">${progGlobal()}%</span></div>${barra(progGlobal())}</div></div>`;
 x+=`<div class="card"><h2>Horas estudiadas por materia <span class="muted">(${totH} h en total)</span></h2><div class="chart">${MATERIAS.map(m=>{const v=minM[m.id]||0;return `<div class="r"><span>${esc(m.id)} · ${esc(m.nombre.split(' ')[0])}</span><div class="bar" style="height:14px"><i style="width:${pct(v,maxM)}%;background:${m.color}"></i></div><span>${(v/60).toFixed(1)} h</span></div>`;}).join('')}
  ${(minM.ING||minM.GEN)?`<div class="r"><span>Inglés / otros</span><div class="bar" style="height:14px"><i style="width:${pct((minM.ING||0)+(minM.GEN||0),maxM)}%;background:#b5a26b"></i></div><span>${(((minM.ING||0)+(minM.GEN||0))/60).toFixed(1)} h</span></div>`:''}</div>
  <p class="muted">Se registra con el Pomodoro o con «Registrar tiempo manual» en la pantalla Pomodoro.</p></div>`;
 x+=`<div class="card"><h2>Respaldo</h2><p class="muted">Tus datos viven solo en este dispositivo. Exporta un respaldo de vez en cuando.</p><div class="row"><button class="btn sec" onclick="exportar()">⬇ Exportar respaldo (JSON)</button><label class="btn sec" style="margin:0">⬆ Importar<input type="file" accept="application/json,.json" class="hide" onchange="importar(this)"></label></div></div>`;
 return x;};
function habIngles(v){S.habits.ingles[hoy()]=v;if(v)marcaActividad();guardar();}
function habFisicoRapido(v){const h=hoy();S.habits.fisico[h]=S.habits.fisico[h]||{};S.habits.fisico[h].otro=v;guardar();}
function resumenTemario(){return `<div class="card"><h2>Exámenes de la promoción</h2><table class="hab"><tr><th>Día</th><th>Examen</th></tr>${EXAMENES.map(e=>`<tr><td>${e.dia}</td><td>${e.examen}</td></tr>`).join('')}</table><p class="muted">Temario: ${UNITS.length} unidades en ${MATERIAS.length} materias escritas.</p></div>`;}

/* ---- Configuración ---- */
V.setup=()=>{const s=S.settings||{inicio:hoy(),dia1:FECHA_PROBABLE,dia2:'',dia3:'',min:[60,60,60,60,60,120,90],repaso:21,simDia:6};
 return `<div class="card hl"><h1>Configurar mi plan</h1>
 <p class="muted">Viene precargada una fecha probable; ajústala cuando se publique la oficial. Puedes cambiarla después y recalcular.</p>
 <div class="grid g2"><div><label for="fIni">Fecha de inicio</label><input type="date" id="fIni" value="${s.inicio}"></div>
 <div><label for="fD1">Fecha del examen (Día uno) – <span class="tag k">fecha probable</span></label><input type="date" id="fD1" value="${s.dia1}"><span class="muted">Fecha probable: abril de 2027 (día exacto por confirmar). Cámbiala cuando se publique la fecha oficial y recalcula.</span></div>
 <div><label for="fD2">Día dos (exámenes escritos)</label><input type="date" id="fD2" value="${s.dia2||''}"><span class="muted">Si lo dejas vacío: día siguiente al Día uno.</span></div>
 <div><label for="fD3">Día tres (médico y físico)</label><input type="date" id="fD3" value="${s.dia3||''}"><span class="muted">Si lo dejas vacío: dos días después del Día uno.</span></div></div>
 <h3 style="margin-top:14px">Minutos disponibles para estudiar</h3>
 <div class="grid g2"><div><label for="fLV">Lunes a viernes</label><input type="number" min="0" max="600" step="5" id="fLV" value="${s.min[0]}"></div><div><label for="fSD">Sábado y domingo</label><input type="number" min="0" max="600" step="5" id="fSD" value="${s.min[5]}"></div></div>
 <button class="btn sm sec" style="margin-top:6px" onclick="aplicarMin()">Aplicar a cada día ↓</button>
 <div class="grid g4" style="margin-top:6px">${DIAS.map((d,i)=>`<div><label for="fm${i}">${d}</label><input type="number" min="0" max="600" step="5" id="fm${i}" value="${s.min[i]}"></div>`).join('')}</div>
 <div class="grid g2" style="margin-top:6px"><div><label for="fRep">Días de repaso general final</label><input type="number" id="fRep" min="2" max="30" value="${s.repaso}"></div>
 <div><label for="fSim">Día del mini-simulacro semanal</label><select id="fSim">${DIAS.map((d,i)=>`<option value="${i}" ${+s.simDia===i?'selected':''}>${d}</option>`).join('')}</select></div></div>
 <div class="row" style="margin-top:12px"><button class="btn" onclick="guardarSetup()">Generar plan</button>${S.settings?'<a class="btn sec" href="#inicio">Cancelar</a>':''}</div>
 <p class="muted" style="margin-top:8px">La distribución pondera la carga estimada de cada unidad (Legislación Militar es la más pesada), intercala materias, reserva 10 min diarios para tarjetas y un mini-simulacro semanal. Con tiempo suficiente se organiza en fases: <b>1) Primera vuelta</b> (lectura activa y Cornell, ~60%), <b>2) Profundización</b> (Feynman, preguntas guía y tarjetas, ~25%), <b>3) Práctica de examen</b> (simulacros por materia, ~15%) y <b>4) Repaso general</b> (últimos ${s.repaso} días).</p></div>`;};
function aplicarMin(){const a=$('#fLV').value,b=$('#fSD').value;for(let i=0;i<5;i++)$('#fm'+i).value=a;$('#fm5').value=b;$('#fm6').value=b;}
function guardarSetup(){
 const s={inicio:$('#fIni').value,dia1:$('#fD1').value,dia2:$('#fD2').value,dia3:$('#fD3').value,min:DIAS.map((_,i)=>Math.max(0,+$('#fm'+i).value||0)),repaso:Math.max(2,+$('#fRep').value||14),simDia:+$('#fSim').value};
 if(!s.inicio||!s.dia1){toast('Captura la fecha de inicio y la del Día uno.');return;}
 if(s.dia1<=s.inicio){toast('El examen debe ser después de la fecha de inicio.');return;}
 if(!s.min.some(x=>x>0)){toast('Asigna minutos al menos a un día.');return;}
 const prev=S.settings;S.settings=s;const r=generarPlan();
 if(r.error){S.settings=prev;toast(r.error);return;}
 S.plan=r.plan;S.plan.avisos=r.avisos;guardar();location.hash='#plan';toast('Plan generado ✔');}
function recalcular(){if(!S.settings)return;const desde=hoy()>S.settings.inicio?hoy():S.settings.inicio;const r=generarPlan(desde);if(r.error){toast(r.error);return;}S.plan=r.plan;S.plan.avisos=r.avisos;guardar();render();toast('Plan recalculado desde hoy ✔');}

/* ---- Plan semanal ---- */
let semOff=null;
V.plan=()=>{if(!S.plan)return `<div class="card">Aún no tienes plan. <a href="#setup">Configúralo aquí</a>.</div>`;
 const h=hoy();const keys=Object.keys(S.plan.days).sort();const first=parse(keys[0]);
 const lunes0=addD(first,-dow(first));
 const nSem=Math.ceil((diffD(ymd(lunes0),keys[keys.length-1])+1)/7);
 if(semOff===null){semOff=Math.max(0,Math.min(nSem-1,Math.floor(diffD(ymd(lunes0),h)/7)));}
 const lun=addD(lunes0,semOff*7);
 let tot=0,hech=0;
 let x=`<div class="card hl"><div class="row" style="justify-content:space-between"><h1 style="margin:0">Semana ${semOff+1} de ${nSem}</h1><span class="muted">${fmt(ymd(lun))} – ${fmt(ymd(addD(lun,6)))}</span></div>
 <div class="row" style="margin-top:8px"><button class="btn sm sec" ${semOff<=0?'disabled':''} onclick="semOff--;render()">◀ Anterior</button><button class="btn sm sec" onclick="semOff=null;render()">Hoy</button><button class="btn sm sec" ${semOff>=nSem-1?'disabled':''} onclick="semOff++;render()">Siguiente ▶</button>
 <span class="sp" style="flex:1"></span><button class="btn sm sec" onclick="recalcular()">↻ Recalcular</button><a class="btn sm sec" href="#setup">Ajustes del plan</a></div>
 ${(S.plan.fases||[]).length?`<details style="margin-top:8px"><summary class="small">Fases del plan · Día uno: ${fmt(S.settings.dia1)}</summary>${S.plan.fases.map(f=>`<div class="small" style="margin:4px 0"><b>${esc(f.n)}</b> (${fmt(f.ini)} – ${fmt(f.fin)}): ${esc(f.desc)}</div>`).join('')}</details>`:''}
 ${(S.plan.avisos||[]).map(a=>`<div class="aviso" style="margin-top:6px">${esc(a)}</div>`).join('')}</div><div class="week">`;
 for(let i=0;i<7;i++){const k=ymd(addD(lun,i));const ts=tareasDe(k);ts.forEach(t=>{if(!['rest','exam'].includes(t.t)){tot++;if(t.done)hech++;}});
  const mins=ts.reduce((a,t)=>a+(t.min||0),0);
  const fz=faseDe(k);const fase=fz?`<span class="tag k">${esc(fz.n.split(' · ')[1])}</span>`:'';
  x+=`<div class="day ${k===h?'today':''}"><h4><span>${fmt(k)} ${k===h?'<span class="tag">hoy</span>':''} ${fase}</span><span class="muted">${mins?mins+' min':''}</span></h4>${ts.length?ts.map(t=>filaTarea(k,t)).join(''):'<span class="muted small">—</span>'}</div>`;}
 x+=`</div><div class="card" style="margin-top:12px"><b>Cumplimiento de la semana:</b> ${hech}/${tot} ${barra(pct(hech,tot))}<div class="row" style="margin-top:10px"><button class="btn sm sec" onclick="exportarICS()">📅 Exportar plan a calendario (.ics)</button></div><p class="muted">El archivo .ics se importa en Google Calendar (Configuración → Importar y exportar) para recibir recordatorios.</p></div>`;
 return x;};

/* ---- Temario ---- */
V.temario=(mid)=>{
 const ms=mid&&MMAP[mid]?[MMAP[mid]]:MATERIAS;
 let x=`<div class="card hl"><h1>Temario oficial</h1><p class="muted">Apéndice Promoción General 2026 (Caps. 2/os.) · Capitán Segundo Enfermera. Estado por unidad: <span class="st0">No visto</span> · <span class="st1">Leído</span> · <span class="st2">Resumido</span> · <span class="st3">Dominado</span>.</p>
 <div class="row">${MATERIAS.map(m=>`<a class="btn sm ${mid===m.id?'':'sec'}" href="#temario/${m.id}">${m.id}</a>`).join('')}<a class="btn sm ${!mid?'':'sec'}" href="#temario">Todas</a></div>
 <div style="margin-top:10px"><div class="row" style="justify-content:space-between"><b class="small">Avance global</b><span class="small">${progGlobal()}%</span></div>${barra(progGlobal())}</div></div>`;
 ms.forEach(m=>{const cnt=[0,0,0,0];m.units.forEach(u=>cnt[st(u.id)]++);
  x+=`<div class="card"><div class="row" style="justify-content:space-between"><h2 style="color:${m.color};margin:0">${esc(m.nombre)}</h2><span class="tag">${m.clave}</span></div>
  <div style="margin:8px 0">${barra(progMateria(m),m.color)}<span class="muted">${progMateria(m)}% · ${m.units.length} unidades · ${cnt[3]} dominadas · ${cnt[2]} resumidas · ${cnt[1]} leídas</span></div>`;
  m.libros.forEach(l=>{x+=`<details ${ms.length===1?'open':''}><summary>${l.n}. ${esc(l.nombre)} <span class="muted">(${esc(l.ref)})</span></summary>`;
   if(!l.ley)x+=`<p class="muted small">Manual de la SEDENA: estúdialo con tu ejemplar oficial.</p>`;
   l.grupos.forEach(g=>{x+=`<div style="margin:6px 0 2px 4px;font-weight:600;font-size:.9rem">${esc(g.t==='Ley completa.'?'Ley completa':g.t)}</div>`;
    g.u.forEach((_,ui)=>{const u=m.units.find(z=>z.libro===l&&z.grupo===g.t&&z.titulo===g.u[ui][0]);const e=st(u.id);const nc=(S.cards||[]).filter(c=>c.u===u.id).length;
     x+=`<div class="unit" onclick="location.hash='#unidad/${u.id}'"><span class="nm">${esc(u.titulo)}${u.sinNombre?' <span class="muted">(la guía no indica nombre)</span>':''}${nc?` <span class="tag k">${nc} tarjetas</span>`:''}</span><span class="pill st${e}">${ESTADOS[e]}</span></div>`;});});
   x+=`</details>`;});
  x+=`</div>`;});
 return x;};

/* ---- Unidad ---- */
let uTab='preg';
V.unidad=(id)=>{const u=UMAP[id];if(!u)return'<div class="card">Unidad no encontrada.</div>';const m=MMAP[u.m];const d=U(id);const qs=preguntas(u);
 const tabs=[['preg','Preguntas guía'],['cornell','Notas Cornell'],['feyn','Feynman'],['mapa','Esquema'],['cards','Tarjetas']];
 let x=`<div class="card hl" style="border-left-color:${m.color}"><a href="#temario/${m.id}" class="small">← ${esc(m.nombre)}</a>
 <h1 style="margin-top:6px">${esc(u.tema)}</h1>
 <div class="small"><b>${esc(u.libro.nombre)}</b> <span class="muted">${esc(u.libro.ref)}</span><br>${esc(u.grupo==='Ley completa.'?'Ley completa':u.grupo)}${u.completo?' · <b>Completo</b>':' · '+esc(u.titulo)}</div>
 <label style="margin-top:10px">Estado</label><div class="seg">${ESTADOS.map((e,i)=>`<button class="${d.st===i?'on':''}" onclick="setEstado('${id}',${i})">${e}</button>`).join('')}</div>
 <div class="row" style="margin-top:10px"><button class="btn sm" onclick="pomoUnidad('${id}')">▶ Pomodoro con esta unidad</button></div></div>
 <div class="seg" style="margin-bottom:12px">${tabs.map(t=>`<button class="${uTab===t[0]?'on':''}" onclick="uTab='${t[0]}';render()">${t[1]}</button>`).join('')}</div>`;
 if(uTab==='preg'){x+=`<div class="card"><div class="aviso">⚠️ Estas preguntas se generan <b>solo a partir del título</b> de la unidad en la guía oficial. La app <b>no contiene respuestas ni texto legal</b>. Respóndelas tú consultando ${esc(u.libro.corto)} (${esc(u.libro.ref)}). Primero intenta responder de memoria (recuperación activa) y después verifica.</div>
  ${qs.map((q,i)=>`<div class="q">${i+1}. ${esc(q)}</div><textarea data-q="${i}" oninput="guardaResp('${id}',${i},this.value)" placeholder="Tu respuesta (con referencia al artículo / página)">${esc(d.ans[i]||'')}</textarea>`).join('')}
  <div class="row" style="margin-top:8px"><button class="btn sm sec" onclick="leerPreg('${id}')">🔊 Escuchar preguntas y respuestas</button><button class="btn sm sec" onclick="detener()">⏹</button></div></div>`;}
 if(uTab==='cornell'){x+=`<div class="card"><h3>Método Cornell</h3><p class="muted">Columna izquierda: palabras clave o preguntas. Derecha: notas mientras lees. Abajo: resumen en 3–5 líneas con tus palabras.</p>
  <div class="cornell"><div><label>Claves / preguntas</label><textarea style="min-height:200px" oninput="guardaCornell('${id}','c',this.value)">${esc(d.cornell.c)}</textarea></div>
  <div><label>Notas</label><textarea style="min-height:200px" oninput="guardaCornell('${id}','n',this.value)">${esc(d.cornell.n)}</textarea></div>
  <div class="sum"><label>Resumen</label><textarea oninput="guardaCornell('${id}','s',this.value)">${esc(d.cornell.s)}</textarea></div></div>
  <div class="row" style="margin-top:8px"><button class="btn sm sec" onclick="leer(S.units['${id}'].cornell.s+'. '+S.units['${id}'].cornell.n)">🔊 Escuchar resumen y notas</button><button class="btn sm sec" onclick="detener()">⏹</button></div></div>`;}
 if(uTab==='feyn'){x+=`<div class="card"><h3>Técnica Feynman</h3><ol class="list small"><li>Explica «${esc(u.tema)}» como si se lo enseñaras a una enfermera recién egresada, sin tecnicismos.</li><li>Marca con <b>??</b> donde te trabes o no puedas explicar.</li><li>Regresa al texto oficial solo en esas partes y corrige.</li><li>Simplifica: ¿lo puedes decir en 5 líneas? ¿Con un ejemplo de tu servicio?</li></ol>
  <textarea style="min-height:180px" oninput="guardaCampo('${id}','feyn',this.value)" placeholder="Mi explicación sencilla...">${esc(d.feyn)}</textarea></div>`;}
 if(uTab==='mapa'){x+=`<div class="card"><h3>Esquema / mapa mental</h3><p class="small">Pon al centro <b>«${esc(u.tema)}»</b>. Crea ramas solo con lo que encuentres en el texto oficial, por ejemplo: definiciones · clasificaciones o tipos · sujetos / responsables · requisitos o etapas · obligaciones y consecuencias · relación con otras unidades. Usa colores y pocas palabras por rama.</p>

function leer(t){if(!('speechSynthesis' in window)){toast('Tu navegador no soporta lectura en voz alta.');return;}speechSynthesis.cancel();const txt=String(t||'').trim();if(!txt){toast('No hay texto para leer.');return;}
 const ut=new SpeechSynthesisUtterance(txt);ut.lang='es-MX';const v=speechSynthesis.getVoices().find(v=>/es[-_]MX/i.test(v.lang))||speechSynthesis.getVoices().find(v=>/^es/i.test(v.lang));if(v)ut.voice=v;ut.rate=1;speechSynthesis.speak(ut);}

function cartasPendientes(){const h=hoy();return S.cards.filter(c=>c.due<=h);}
function nuevaCarta(uid){const f=$('#cF').value.trim(),b=$('#cB').value.trim();if(!f||!b){toast('Escribe frente y reverso.');return;}
 S.cards.push({id:'c'+Date.now().toString(36)+Math.random().toString(36).slice(2,5),u:uid,f,b,ef:2.5,iv:0,rep:0,due:hoy(),creada:hoy()});marcaActividad();guardar();render();toast('Tarjeta agregada');}
function borrarCarta(cid){if(!confirm('¿Borrar esta tarjeta?'))return;S.cards=S.cards.filter(c=>c.id!==cid);guardar();render();}
function sm2(c,q){ // q: 0..5
 if(q<3){c.rep=0;c.iv=1;}else{c.rep++;c.iv=c.rep===1?1:c.rep===2?6:Math.round(c.iv*c.ef);}
 c.ef=Math.max(1.3,c.ef+(0.1-(5-q)*(0.08+(5-q)*0.02)));c.due=ymd(addD(new Date(),c.iv));}

 <label>Filtrar por materia</label><select onchange="filtroM=this.value;flipped=false;render()"><option value="">Todas (intercaladas)</option>${MATERIAS.map(m=>`<option value="${m.id}" ${filtroM===m.id?'selected':''}>${esc(m.nombre)}</option>`).join('')}</select></div>`;
 if(!S.cards.length)return x+`<div class="card info">Aún no tienes tarjetas. Crea las tuyas desde cada unidad del <a href="#temario">Temario</a> → pestaña «Tarjetas». La app no trae tarjetas prehechas para no inventar contenido: tú las llenas con el texto oficial.</div>`;
 if(!due.length)return x+`<div class="card"><p>✅ ¡Al día! No hay tarjetas pendientes${filtroM?' en esta materia':''}. Vuelve mañana.</p></div>`;
 const c=due[0];const u=UMAP[c.u];
 x+=`<div class="card"><div class="small">${tagM(u.m)} <span class="muted">${esc(u.tema)}</span></div><div class="flash" style="margin-top:8px">${esc(flipped?c.b:c.f)}</div>`;
 if(!flipped)x+=`<p class="muted">Intenta responder en voz alta o por escrito antes de voltear.</p><button class="btn" style="width:100%" onclick="flipped=true;render()">Mostrar respuesta</button>`;
 else x+=`<p class="muted">¿Qué tan bien la recordaste?</p><div class="grid g4"><button class="btn peligro" onclick="calif('${c.id}',1)">Otra vez</button><button class="btn sec" onclick="calif('${c.id}',3)">Difícil</button><button class="btn" onclick="calif('${c.id}',4)">Bien</button><button class="btn" style="background:var(--ok)" onclick="calif('${c.id}',5)">Fácil</button></div>`;
 return x+`</div>`;};

let SIM=null;
function vistaSim(){
 let x=`<div class="seg" style="margin-bottom:12px"><button onclick="location.hash='#practicar'">Tarjetas (repaso espaciado)</button><button class="on">Simulacro</button></div>`;
 if(!SIM){const vistos=UNITS.filter(u=>st(u.id)>=1).length;
  x+=`<div class="card hl"><h1>Simulacro</h1><p class="small">Práctica de examen intercalada: la app toma preguntas guía al azar de distintas materias. Responde <b>sin ver el manual</b>, luego compara con tu respuesta guardada o con el texto oficial y califícate con honestidad.</p>
  <label>Origen de las preguntas</label><select id="sOr"><option value="vistas">Unidades que ya leí o más (${vistos})</option><option value="todas">Todo el temario (${UNITS.length})</option>${MATERIAS.map(m=>`<option value="${m.id}">${esc(m.nombre)}</option>`).join('')}</select>
  <label>Número de preguntas</label><select id="sN"><option>10</option><option selected>20</option><option>30</option><option>50</option></select>
  <div class="row" style="margin-top:10px"><button class="btn" onclick="iniciarSim()">Comenzar</button></div></div>`;
  const ult=S.sims.slice(-8).reverse();
  if(ult.length)x+=`<div class="card"><h3>Últimos simulacros</h3>${ult.map(s=>`<div class="task"><div class="tx">${fmt(s.f)} · ${s.n} preguntas</div><span class="min">${s.pct}% bien</span></div>`).join('')}</div>`;
  return x;}
 if(SIM.i>=SIM.qs.length){const ok=SIM.res.filter(r=>r===2).length,re=SIM.res.filter(r=>r===1).length;const p=pct(ok+re*0.5,SIM.qs.length);
  const malas=SIM.qs.filter((q,i)=>SIM.res[i]===0).map(q=>q.u);const uniq=[...new Set(malas)];
  x+=`<div class="card hl"><h1>Resultado: ${p}%</h1><p>${ok} bien · ${re} regular · ${SIM.qs.length-ok-re} por reforzar</p>${uniq.length?`<h3>Unidades a reforzar</h3>${uniq.map(id=>`<div class="unit" onclick="location.hash='#unidad/${id}'"><span class="nm">${tagM(UMAP[id].m)} ${esc(UMAP[id].tema)}</span><span class="pill st${st(id)}">${ESTADOS[st(id)]}</span></div>`).join('')}`:''}
  <div class="row" style="margin-top:10px"><button class="btn" onclick="SIM=null;render()">Terminar</button></div></div>`;return x;}
 const q=SIM.qs[SIM.i];const u=UMAP[q.u];const guardada=(S.units[q.u]&&S.units[q.u].ans[q.k])||'';
 x+=`<div class="card"><div class="row" style="justify-content:space-between"><span class="tag">Pregunta ${SIM.i+1}/${SIM.qs.length}</span>${tagM(u.m)}</div>
 <p class="small muted" style="margin:8px 0 2px">${esc(u.libro.nombre)} · ${esc(u.completo?u.grupo:u.titulo)}</p><div class="q" style="font-size:1rem">${esc(preguntas(u)[q.k])}</div>
 <textarea id="simR" placeholder="Responde de memoria..."></textarea>`;
 if(!SIM.show)x+=`<div class="row" style="margin-top:8px"><button class="btn" onclick="SIM.show=true;render()">Comparar</button></div>`;
 else x+=`<div class="card info" style="margin-top:8px"><b>Tu respuesta guardada en la unidad:</b><br>${guardada?esc(guardada).replace(/\n/g,'<br>'):'<span class="muted">Aún no la has escrito. Verifica en el texto oficial y guárdala en la unidad.</span>'}</div>
  <div class="grid g3"><button class="btn peligro" onclick="calSim(0)">Por reforzar</button><button class="btn sec" onclick="calSim(1)">Regular</button><button class="btn" onclick="calSim(2)">Bien</button></div>`;
 return x+`</div>`;}
function iniciarSim(){const o=$('#sOr').value,n=+$('#sN').value;let pool=o==='vistas'?UNITS.filter(u=>st(u.id)>=1):o==='todas'?UNITS:UNITS.filter(u=>u.m===o);
 if(!pool.length){toast('Aún no hay unidades marcadas como leídas. Elige «Todo el temario».');return;}
 const qs=[];const all=[];pool.forEach(u=>preguntas(u).forEach((_,k)=>{if(k<6)all.push({u:u.id,k});}));
 for(let i=all.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[all[i],all[j]]=[all[j],all[i]];}
 // intercalar: evitar dos seguidas de la misma materia cuando sea posible
 while(qs.length<Math.min(n,all.length)){let j=all.findIndex(a=>!qs.length||UMAP[a.u].m!==UMAP[qs[qs.length-1].u].m);if(j<0)j=0;qs.push(all.splice(j,1)[0]);}
 SIM={qs,i:0,res:[],show:false};render();}
function calSim(v){SIM.res[SIM.i]=v;SIM.i++;SIM.show=false;marcaActividad();
 if(SIM.i>=SIM.qs.length){const ok=SIM.res.filter(r=>r===2).length,re=SIM.res.filter(r=>r===1).length;S.sims.push({f:hoy(),n:SIM.qs.length,pct:pct(ok+re*0.5,SIM.qs.length)});}
 guardar();render();}

 <details style="margin-top:10px"><summary>Configurar tiempos</summary><div class="grid g4"><div><label>Concentración</label><input type="number" min="5" max="90" value="${p.work}" onchange="S.pomo.work=+this.value||25;guardar();render()"></div><div><label>Descanso corto</label><input type="number" min="1" max="30" value="${p.short}" onchange="S.pomo.short=+this.value||5;guardar();render()"></div><div><label>Descanso largo</label><input type="number" min="5" max="60" value="${p.long}" onchange="S.pomo.long=+this.value||15;guardar();render()"></div><div><label>Largo cada</label><input type="number" min="2" max="8" value="${p.every}" onchange="S.pomo.every=+this.value||4;guardar();render()"></div></div></details></div>
 <div class="card"><h3>Registrar tiempo manual</h3><p class="muted">Si estudiaste sin el temporizador, regístralo para tus estadísticas (se asigna a la materia seleccionada arriba).</p><div class="row"><input type="number" id="manMin" min="5" max="600" step="5" placeholder="minutos" style="width:120px"><button class="btn sec" onclick="registroManual()">Registrar</button></div></div>

const mmss=ms=>{const s=Math.round(ms/1000);return pad(Math.floor(s/60))+':'+pad(s%60);};
function pomoStart(modo){const p=S.pomo;const m=($('#pM')&&$('#pM').value)||p.lastM||'LM';const u=($('#pU')&&$('#pU').value)||'';
 const dur=(modo==='work'?p.work:modo==='short'?p.short:p.long)*60000;
 S.pomoRun={modo,ini:Date.now(),fin:Date.now()+dur,m,u};p.lastM=m;guardar();
 if('Notification' in window&&Notification.permission==='default')try{Notification.requestPermission();}catch(e){}
 tick();render();}
function pomoUnidad(id){S.pomo.lastM=UMAP[id].m;S.pomo.lastU=id;guardar();location.hash='#pomodoro';}
function logMin(m,u,min,k){if(min<1)return;S.logs.push({f:hoy(),m,u,min:Math.round(min),k});marcaActividad();}
function pomoStop(){const r=S.pomoRun;if(r&&r.modo==='work'){const min=(Date.now()-r.ini)/60000;if(min>=1){logMin(r.m,r.u,min,'parcial');toast(`Se registraron ${Math.round(min)} min`);}}S.pomoRun=null;guardar();render();}
function registroManual(){const v=+$('#manMin').value;if(!v){toast('Escribe los minutos.');return;}logMin(($('#pM')&&$('#pM').value)||'GEN','',v,'manual');guardar();toast('Tiempo registrado');render();}
function beep(){try{const a=new (window.AudioContext||window.webkitAudioContext)();[0,0.35,0.7].forEach(t=>{const o=a.createOscillator(),g=a.createGain();o.frequency.value=880;o.connect(g);g.connect(a.destination);g.gain.setValueAtTime(0.2,a.currentTime+t);g.gain.exponentialRampToValueAtTime(0.001,a.currentTime+t+0.3);o.start(a.currentTime+t);o.stop(a.currentTime+t+0.3);});}catch(e){}
 if(navigator.vibrate)navigator.vibrate([200,100,200]);}
function avisar(t){beep();toast(t);try{if('Notification' in window&&Notification.permission==='granted')new Notification('Plan de Ascenso',{body:t});}catch(e){}}
function tick(){clearInterval(pomoInt);pomoInt=setInterval(()=>{const r=S.pomoRun;const bar=$('#pomoBar');
  if(!r){bar.style.display='none';clearInterval(pomoInt);return;}
  const left=r.fin-Date.now();bar.style.display='block';bar.textContent=`${r.modo==='work'?'⏱ Concentración':'☕ Descanso'} · ${mmss(Math.max(0,left))} · ${r.m}`;
  const t=$('#tmr');if(t)t.textContent=mmss(Math.max(0,left));
  if(left<=0){const p=S.pomo;
   if(r.modo==='work'){logMin(r.m,r.u,p.work,'pomo');p.count++;const largo=p.count%p.every===0;S.pomoRun={modo:largo?'long':'short',ini:Date.now(),fin:Date.now()+(largo?p.long:p.short)*60000,m:r.m,u:r.u};avisar(largo?'¡Pomodoro completo! Descanso largo.':'¡Pomodoro completo! Toma un descanso.');}
   else{S.pomoRun=null;avisar('Fin del descanso. ¿Listo el siguiente pomodoro?');}
   guardar();if(location.hash==='#pomodoro'||location.hash==='#inicio'||location.hash==='')render();}},500);}

 ['Forest','https://www.forestapp.cc','Bloquea distracciones del celular mientras estudias (planta un árbol virtual).'],
 ['Pomofocus','https://pomofocus.io','Temporizador Pomodoro en el navegador, alternativa al de esta app.'],
 ['Google Calendar','https://calendar.google.com','Importa el archivo .ics de tu plan (pantalla Plan) para recibir recordatorios diarios.'],
 ['NotebookLM (Google)','https://notebooklm.google.com','Sube los PDF oficiales de las leyes y pídele resúmenes o preguntas citando el texto. Verifica siempre contra el documento.'],
 ['NaturalReader','https://www.naturalreaders.com','Texto a voz: escucha las leyes en PDF mientras te trasladas.'],
 ['TTSReader','https://ttsreader.com','Texto a voz gratis en el navegador: pega un capítulo y escúchalo.'],
 ['XMind','https://www.xmind.com','Mapas mentales.'],
 ['MindMeister','https://www.mindmeister.com','Mapas mentales en línea.'],
 ['GoConqr','https://www.goconqr.com','Mapas mentales, fichas y tests en un solo lugar.']];
const lnk=x=>`<div class="task"><div class="tx"><a href="${x[1]}" target="_blank" rel="noopener"><b>${x[0]}</b></a><br><span class="small">${x[2]}</span><br><span class="muted small">${x[1]}</span></div></div>`;
V.herramientas=()=>`<div class="card hl"><h1>Fuentes oficiales y herramientas</h1></div>
 <div class="card"><h2>Textos legales oficiales</h2>${FUENTES.map(lnk).join('')}
 <div class="aviso" style="margin-top:8px"><b>Ojo con las versiones:</b> la guía cita una fecha de D.O.F. para cada ordenamiento (p. ej. CJM 16-07-2025; Reglamento de la Ley de Ascensos 03-05-2023). Los portales oficiales muestran el texto <b>vigente</b>, que puede tener reformas posteriores a la fecha citada. Compara la fecha de última reforma y, si difiere, confirma por conducto regular cuál versión se evalúa.</div></div>
 <div class="card"><h2>Manuales de la SEDENA (DN M …)</h2><p class="small">Los manuales del temario (Logística Militar DN M 1459, Operaciones Militares DN M 1455, Derechos Humanos DN M 110, Aspectos Administrativos de Enfermería DN M 1106, Mando y Liderazgo Militar DN14/I/PFA/S3/N4/F4/F3/0002, Adiestramiento DN M 106 y Aspectos Técnicos de Enfermería DN M 1103) son de distribución interna. <b>Usa tus propios ejemplares oficiales</b> en la edición que indica la guía; esta app no los enlaza ni reproduce.</p></div>
 <div class="card"><h2>Apps gratuitas recomendadas</h2>${APPS.map(lnk).join('')}<p class="muted small">Algunas tienen funciones de pago opcionales; las básicas son gratuitas.</p></div>`;

const ING_SEM=[['Lunes','Vocabulario: 10 palabras nuevas en tarjetas (inglés → español) y repásalas.'],['Martes','Escucha: un episodio corto de BBC Learning English o VOA Learning English; anota 5 frases.'],['Miércoles','Gramática: un tema en British Council LearnEnglish y sus ejercicios.'],['Jueves','Lectura: una noticia en VOA Learning English (nivel 1 o 2); resume en 3 líneas en inglés.'],['Viernes','Lección diaria de Duolingo o USA Learns + leer en voz alta 5 minutos.'],['Sábado','Repaso: vuelve a escuchar el audio del martes sin texto; ¿cuánto entiendes ahora?'],['Domingo','Mini-autoevaluación: un test de nivel o ejercicios de gramática de lo que más te costó.']];
const ING_REC=[['BBC Learning English','https://www.bbc.co.uk/learningenglish','Cursos, audios y videos cortos gratuitos por nivel.'],['VOA Learning English','https://learningenglish.voanews.com','Noticias en inglés lento con texto y audio.'],['British Council – LearnEnglish','https://learnenglish.britishcouncil.org','Gramática, vocabulario y ejercicios interactivos.'],['USA Learns','https://www.usalearns.org','Curso gratuito de inglés con video.'],['Duolingo','https://www.duolingo.com','Práctica diaria de 5–10 minutos.']];
V.ingles=()=>{const h=hoy();const d=dow(new Date());let x=`<div class="card hl"><h1>Diagnóstico de Inglés</h1><p class="small">Se presenta el <b>Día uno</b>. Lo mejor es una práctica <b>corta y diaria</b> (10–15 min) en lugar de sesiones largas ocasionales.</p>
 <div class="card info"><b>Hoy (${DIAS[d]}):</b> ${ING_SEM[d][1]}<div class="row" style="margin-top:8px"><label class="row" style="font-weight:400"><input type="checkbox" ${S.habits.ingles[h]?'checked':''} onchange="habIngles(this.checked);render()"> Hecho hoy</label></div></div></div>`;
 const lun=addD(new Date(),-d);x+=`<div class="card"><h3>Esta semana</h3><table class="hab"><tr>${DIAS3.map(z=>`<th>${z}</th>`).join('')}</tr><tr>${DIAS3.map((_,i)=>{const k=ymd(addD(lun,i));return `<td>${S.habits.ingles[k]?'✅':'·'}</td>`;}).join('')}</tr></table></div>`;
 x+=`<div class="card"><h3>Rutina semanal sugerida</h3>${ING_SEM.map(z=>`<div class="task"><div class="tx"><b>${z[0]}:</b> ${z[1]}</div></div>`).join('')}<p class="muted small">Tip: crea tarjetas de vocabulario en cualquier unidad o en Anki y regístralas con el Pomodoro eligiendo «Diagnóstico de Inglés».</p></div>
 <div class="card"><h3>Recursos gratuitos</h3>${ING_REC.map(lnk).join('')}</div>`;return x;};

const FIS=[['cardio','Cardio (trote/caminata)'],['fuerza','Fuerza (abdominales, lagartijas, sentadillas)'],['movilidad','Flexibilidad / movilidad'],['otro','Otra actividad']];
V.fisico=()=>{const d=dow(new Date());const lun=addD(new Date(),-d);const ks=DIAS3.map((_,i)=>ymd(addD(lun,i)));
 let tot=0;ks.forEach(k=>{const o=S.habits.fisico[k]||{};if(Object.values(o).some(Boolean))tot++;});
 return `<div class="card hl"><h1>Capacidad Física</h1><p class="small">Se evalúa el <b>Día tres</b> junto con el Examen Médico. Consulta en tu unidad las pruebas y marcas oficiales vigentes para tu edad y sexo; esta sección es un registro genérico de hábitos.</p><div class="stat"><b>${tot}/7</b><span>días activos esta semana</span></div></div>
 <div class="card"><h3>Semana actual</h3><div style="overflow-x:auto"><table class="hab"><tr><th>Actividad</th>${DIAS3.map((z,i)=>`<th>${z}<br><span class="muted">${parse(ks[i]).getDate()}</span></th>`).join('')}</tr>
 ${FIS.map(f=>`<tr><td>${f[1]}</td>${ks.map(k=>`<td><input type="checkbox" ${(S.habits.fisico[k]||{})[f[0]]?'checked':''} onchange="habFis('${k}','${f[0]}',this.checked)" aria-label="${f[1]} ${k}"></td>`).join('')}</tr>`).join('')}</table></div></div>
 <div class="card small"><h3>Recomendaciones generales</h3><ul class="list"><li>Meta general: al menos 150 min semanales de actividad aeróbica moderada y 2 días de fuerza (recomendación general de la OMS para adultos).</li><li>Aumenta la carga de forma gradual y deja días de recuperación.</li><li>Practica las pruebas en las mismas condiciones del examen (hora, calzado, superficie) en las últimas semanas.</li><li>Si tienes alguna lesión o condición médica, consulta antes a tu médico.</li><li>Dormir 7–8 horas también es parte del entrenamiento y de la memoria.</li></ul></div>`;};
function habFis(k,a,v){S.habits.fisico[k]=S.habits.fisico[k]||{};S.habits.fisico[k][a]=v;guardar();render();}

/* ====== RESPALDO ====== */
V.ajustes=()=>`<div class="card hl"><h1>Respaldo y datos</h1><p class="small">Todo se guarda <b>solo en este navegador</b> (localStorage). Si borras los datos del navegador o cambias de teléfono, necesitarás tu respaldo.</p>
 <div class="row"><button class="btn" onclick="exportar()">⬇ Exportar respaldo (JSON)</button><label class="btn sec" style="margin:0">⬆ Importar respaldo<input type="file" accept="application/json,.json" class="hide" onchange="importar(this)"></label></div></div>
 <div class="card"><h3>Resumen</h3><ul class="list small"><li>Unidades con avance: ${Object.values(S.units).filter(u=>u.st>0).length} / ${UNITS.length}</li><li>Tarjetas: ${S.cards.length}</li><li>Registros de tiempo: ${S.logs.length}</li><li>Simulacros: ${S.sims.length}</li></ul></div>
 <div class="card"><h3>Zona de riesgo</h3><button class="btn peligro" onclick="borrarTodo()">Borrar todos mis datos</button></div>
 <p class="muted small" style="text-align:center">Plan de Ascenso · temario: Apéndice Promoción General 2026 (Caps. 2/os.)</p>`;
function descargar(nombre,tipo,txt){const b=new Blob([txt],{type:tipo});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=nombre;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500);}
function exportar(){descargar(`respaldo-plan-ascenso-${hoy()}.json`,'application/json',JSON.stringify(S,null,1));toast('Respaldo descargado');}
function importar(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const x=JSON.parse(r.result);if(!x||x.v!==1)throw 0;if(!confirm('Esto reemplazará los datos actuales por los del respaldo. ¿Continuar?'))return;S=Object.assign(nuevoEstado(),x);guardar();render();tick();toast('Respaldo importado ✔');}catch(e){toast('Archivo no válido.');}};r.readAsText(f);}
function borrarTodo(){if(!confirm('¿Seguro? Se borrará todo tu avance en este dispositivo.'))return;if(!confirm('Última confirmación: ¿borrar todo?'))return;localStorage.removeItem(KEY);S=nuevoEstado();render();toast('Datos borrados');}
function exportarICS(){if(!S.plan)return;const L=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//PlanAscenso//ES','CALSCALE:GREGORIAN'];
 const limpio=h=>h.replace(/<br>/g,' – ').replace(/<[^>]+>/g,'').replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"').replace(/&#39;/g,"'");
 const icsEsc=t=>t.replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\n/g,'\\n');
 const stamp=new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d+/,'');
 Object.keys(S.plan.days).sort().forEach(k=>{const ts=S.plan.days[k].filter(t=>t.t!=='rest');if(!ts.length)return;const d=k.replace(/-/g,'');const d2=ymd(addD(parse(k),1)).replace(/-/g,'');
  const tot=ts.reduce((a,t)=>a+(t.min||0),0);const ex=ts.find(t=>t.t==='exam');
  L.push('BEGIN:VEVENT','UID:'+d+'-plan@plan-ascenso','DTSTAMP:'+stamp,'DTSTART;VALUE=DATE:'+d,'DTEND;VALUE=DATE:'+d2,'SUMMARY:'+icsEsc(ex?ex.txt:`Estudio (${tot} min)`),'DESCRIPTION:'+icsEsc(ts.map(t=>'• '+limpio(textoTarea(t))+(t.min?` (${t.min} min)`:'')).join('\n')),'END:VEVENT');});
 L.push('END:VCALENDAR');descargar('plan-ascenso.ics','text/calendar',L.join('\r\n'));toast('Calendario descargado');}

/* ====== INICIO ====== */
render();if(S.pomoRun)tick();
if(!S.settings&&!location.hash)location.hash='#inicio';
if('serviceWorker' in navigator&&/^https?:/.test(location.protocol)){navigator.serviceWorker.register('sw.js').catch(()=>{});}
</script>
</body>
</html>
